<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NUR 270A Exam 3 Prep</title>
  <meta name="description" content="Practice questions for NUR 270A Exam 3: newborn and high-risk newborn, postpartum and complications, mother and newborn meds, contraception, and medication math.">
  <style>
:root {
  --ink: #16263a;
  --muted: #5a6b7d;
  --paper: #f5f9f9;
  --card: #ffffff;
  --line: #cfe0e0;
  --teal: #0e6b6b;
  --teal-deep: #0a4f4f;
  --teal-soft: #dcefef;
  --right: #2b7a4b;
  --right-soft: #e1f2e8;
  --wrong: #b3412a;
  --wrong-soft: #f8e4de;
  --amber: #b7791f;
  --focus: #1d4ed8;
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --ink: #e6eef3;
    --muted: #9db0bf;
    --paper: #0f1a24;
    --card: #162433;
    --line: #28404f;
    --teal: #4fc3c3;
    --teal-deep: #7bd9d9;
    --teal-soft: #17353d;
    --right: #66c48a;
    --right-soft: #17332560;
    --wrong: #f08c75;
    --wrong-soft: #3b2420;
    --amber: #e5b25d;
    --focus: #8fb4ff;
  }
}

* { box-sizing: border-box; }
html { font-size: 17px; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.5;
}

:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button { font: inherit; color: inherit; }

.wrap { max-width: 860px; margin: 0 auto; padding: 0 1.25rem; }

/* ----- header ----- */
.top { border-bottom: 1px solid var(--line); background: var(--card); }
.top .wrap { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; padding-top: 1rem; padding-bottom: 1rem; }
.brand { font-family: var(--serif); font-size: 1.25rem; font-weight: 700; margin: 0; }
.brand small { font-family: var(--sans); font-weight: 400; color: var(--muted); font-size: 0.85rem; margin-left: 0.5rem; }
.linkbtn { background: none; border: 0; color: var(--teal); text-decoration: underline; cursor: pointer; padding: 0.25rem; }

main { padding: 1.75rem 0 4rem; }
h2 { font-family: var(--serif); font-size: 1.5rem; margin: 0 0 0.35rem; }
h3 { font-family: var(--serif); font-size: 1.1rem; margin: 1.5rem 0 0.5rem; }
.lede { color: var(--muted); margin: 0 0 1.5rem; max-width: 60ch; }

/* ----- panels ----- */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.25rem; margin-bottom: 1.25rem; }
.panel > h3:first-child { margin-top: 0; }

.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
.mode { position: relative; display: block; border: 1.5px solid var(--line); border-radius: 8px; padding: 0.85rem 1rem; cursor: pointer; background: var(--card); }
.mode input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.mode strong { display: block; font-family: var(--serif); font-size: 1.05rem; }
.mode span { color: var(--muted); font-size: 0.88rem; }
.mode:has(input:checked) { border-color: var(--teal); background: var(--teal-soft); }
.mode:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }

fieldset { border: 0; padding: 0; margin: 0; }
legend { font-family: var(--serif); font-weight: 700; margin-bottom: 0.4rem; padding: 0; }
.chapter { margin: 0 0 0.9rem; }
.chapter-head { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; margin-bottom: 0.3rem; }
.topics { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chip { position: relative; display: inline-flex; align-items: center; gap: 0.35rem; border: 1px solid var(--line); border-radius: 999px; padding: 0.3rem 0.8rem; font-size: 0.9rem; cursor: pointer; background: var(--card); }
.chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chip:has(input:checked) { background: var(--teal); color: #fff; border-color: var(--teal); }
@media (prefers-color-scheme: dark) { .chip:has(input:checked) { color: #0b1620; } }
.chip:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.chip em { font-style: normal; opacity: 0.75; font-size: 0.8rem; }

.row { display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; align-items: center; margin-top: 1rem; }
select { font: inherit; padding: 0.35rem 0.5rem; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
.check { display: inline-flex; align-items: center; gap: 0.4rem; }

.btn { background: var(--teal); color: #fff; border: 0; border-radius: 8px; padding: 0.65rem 1.3rem; font-weight: 600; cursor: pointer; }
@media (prefers-color-scheme: dark) { .btn { color: #0b1620; } }
.btn:hover { background: var(--teal-deep); }
@media (prefers-color-scheme: dark) { .btn:hover { color: #0b1620; } }
.btn.ghost { background: transparent; color: var(--teal); border: 1.5px solid var(--teal); }
.btn.ghost:hover { background: var(--teal-soft); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.25rem; align-items: center; }
.spacer { flex: 1; }

/* ----- progress by topic ----- */
.bars { display: grid; gap: 0.6rem; }
.bar-row { display: grid; grid-template-columns: minmax(150px, 1.2fr) 3fr auto; gap: 0.75rem; align-items: center; font-size: 0.92rem; }
.bar { height: 10px; background: var(--teal-soft); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--teal); }
.bar i.low { background: var(--wrong); }
.bar i.mid { background: var(--amber); }
.bar i.hi { background: var(--right); }
.num { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 6.5em; text-align: right; }

/* ----- rhythm strip (progress) ----- */
.strip { display: flex; align-items: flex-end; gap: 0; margin: 0 0 1.25rem; overflow-x: auto; padding-bottom: 4px; }
.beat { flex: 0 0 auto; width: 28px; height: 30px; padding: 0; background: none; border: 0; cursor: pointer; }
.beat svg { display: block; width: 100%; height: 100%; }
.beat path { fill: none; stroke: var(--line); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.beat.seen path { stroke: var(--teal); }
.beat.right path { stroke: var(--right); }
.beat.wrong path { stroke: var(--wrong); }
.beat.flagged path { stroke-dasharray: 3 2; }
.beat.current { background: var(--teal-soft); border-radius: 4px; }
.plainbar { height: 8px; background: var(--teal-soft); border-radius: 999px; overflow: hidden; margin: 0 0 1.25rem; }
.plainbar i { display: block; height: 100%; background: var(--teal); }

/* ----- question ----- */
.meta { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; color: var(--muted); font-size: 0.88rem; margin-bottom: 0.6rem; }
.tag { background: var(--teal-soft); color: var(--teal-deep); border-radius: 4px; padding: 0.1rem 0.5rem; }
.timer { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
.timer.low { color: var(--wrong); }
.stem { font-family: var(--serif); font-size: 1.2rem; line-height: 1.45; margin: 0 0 1rem; max-width: 62ch; }
.hint { color: var(--muted); font-size: 0.9rem; margin: -0.5rem 0 0.9rem; }
.bars + .hint { margin: 1rem 0 0; }

.opts { display: grid; gap: 0.5rem; margin: 0; padding: 0; list-style: none; }
.opt { position: relative; display: flex; gap: 0.75rem; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 8px; padding: 0.7rem 0.9rem; background: var(--card); cursor: pointer; }
.opt input { margin-top: 0.3rem; accent-color: var(--teal); }
.opt:has(input:checked) { border-color: var(--teal); background: var(--teal-soft); }
.opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.opt.right, .opt.right:has(input:checked) { border-color: var(--right); background: var(--right-soft); }
.opt.wrong, .opt.wrong:has(input:checked) { border-color: var(--wrong); background: var(--wrong-soft); }
.opt.missed { border-style: dashed; border-color: var(--right); }
.locked .opt { cursor: default; }
.mark { margin-left: auto; font-size: 0.82rem; font-weight: 600; white-space: nowrap; }
.right .mark { color: var(--right); }
.wrong .mark { color: var(--wrong); }
.missed .mark { color: var(--right); }

.fill { width: 100%; max-width: 24rem; font: inherit; padding: 0.6rem 0.75rem; border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
.fill.right { border-color: var(--right); background: var(--right-soft); }
.fill.wrong { border-color: var(--wrong); background: var(--wrong-soft); }

.seq { display: grid; gap: 0.5rem; margin: 0; padding: 0; list-style: none; }
.seq li { display: flex; align-items: center; gap: 0.6rem; border: 1.5px solid var(--line); border-radius: 8px; padding: 0.55rem 0.75rem; background: var(--card); }
.seq .pos { font-weight: 700; color: var(--teal); min-width: 1.4em; }
.seq .txt { flex: 1; }
.seq button { border: 1px solid var(--line); background: var(--card); border-radius: 6px; width: 2rem; height: 2rem; cursor: pointer; }
.seq button[disabled] { opacity: 0.35; cursor: not-allowed; }
.seq li.right { border-color: var(--right); background: var(--right-soft); }
.seq li.wrong { border-color: var(--wrong); background: var(--wrong-soft); }

.feedback { margin-top: 1.1rem; border-left: 4px solid var(--teal); background: var(--teal-soft); padding: 0.8rem 1rem; border-radius: 0 8px 8px 0; }
.feedback.right { border-color: var(--right); background: var(--right-soft); }
.feedback.wrong { border-color: var(--wrong); background: var(--wrong-soft); }
.feedback strong { display: block; margin-bottom: 0.25rem; }
.feedback p { margin: 0.25rem 0 0; }
.feedback .ref { color: var(--muted); font-size: 0.88rem; }

/* ----- results ----- */
.score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem 1.25rem; margin-bottom: 0.5rem; }
.score .big { font-family: var(--serif); font-size: 2.6rem; font-weight: 700; line-height: 1; }
.review { display: grid; gap: 0.75rem; margin-top: 1rem; }
.review details { border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.review summary { cursor: pointer; padding: 0.7rem 0.9rem; display: flex; gap: 0.6rem; align-items: baseline; }
.review summary .ok { color: var(--right); font-weight: 700; }
.review summary .no { color: var(--wrong); font-weight: 700; }
.review .body { padding: 0 0.9rem 0.9rem; }
.review .body p { margin: 0.35rem 0; }
.empty { color: var(--muted); }

@media (max-width: 640px) {
  html { font-size: 16px; }
  .modes { grid-template-columns: 1fr; }
  .bar-row { grid-template-columns: 1fr; gap: 0.2rem; }
  .num { text-align: left; }
  .stem { font-size: 1.12rem; }
}

@media (prefers-reduced-motion: no-preference) {
  .bar i, .plainbar i { transition: width 0.4s ease; }
}

.ow{padding-left:18px;margin:8px 0}.ow li{margin:8px 0}.ow li.yes strong{color:var(--ok,#15803d)}
</style>

    <div class="wrap">
      <h1 class="brand">NUR 270A Exam 3 Prep <small>Newborn, postpartum, meds, contraception</small></h1>
      <button type="button" class="linkbtn" id="homeLink">Setup</button>
    </div>
  </header>
  <main class="wrap" id="app" tabindex="-1">
    <p id="fallback" style="padding:16px 0">Loading the quiz. If this page stays blank, your file viewer is blocking scripts. Open this file in Safari or Chrome instead (on iPhone: Share, then Open in Safari), or use the hosted link.</p><noscript>This practice app needs JavaScript turned on. Open it in Safari or Chrome.</noscript>

  <script>

/* NUR 270A Exam 3 question bank, limited to the professor-emphasized topics.
 * ATI questions keep their per-option rationales; the rest were written with one rationale per answer choice.
 *
 * To add a question, append a line below using one of the helpers:
 *   mc(topicId, stem, [options], correctIndex, rationale)
 *   sata(topicId, stem, [options], [correctIndexes], rationale)
 *   fill(topicId, stem, [acceptedAnswers], rationale)
 *   order(topicId, stem, [itemsInCorrectOrder], rationale)
 * Progress is keyed to a hash of the stem, so editing a stem resets that question's history.
 */
(function () {
  "use strict";

  window.CHAPTERS = {
    ek: "Exam 3 focus topics (professor emphasis)"
  };

  window.TOPICS = [
    { id: "ek_bf", label: "Breastfeeding: latch, milk types, hormones, contraception, intake", chapter: "ek", ref: "Breastfeeding notes" },
    { id: "ek_pp", label: "Postpartum care, complications, contraception, emotional changes", chapter: "ek", ref: "Postpartum care, complications, contraception, emotional changes notes" },
    { id: "ek_reflex", label: "Newborn reflexes", chapter: "ek", ref: "Newborn reflexes notes" },
    { id: "ek_apgar", label: "Apgar scoring", chapter: "ek", ref: "Apgar scoring notes" },
    { id: "ek_resp", label: "Newborn respiratory distress and RDS", chapter: "ek", ref: "Newborn respiratory distress and RDS notes" },
    { id: "ek_nas", label: "Neonatal abstinence syndrome", chapter: "ek", ref: "Neonatal abstinence syndrome notes" },
    { id: "ek_assess", label: "Newborn physical assessment", chapter: "ek", ref: "Newborn physical assessment notes" },
    { id: "ek_sleep", label: "Newborn sleep and behavior states", chapter: "ek", ref: "Newborn sleep and behavior states notes" }
  ];

  var Q = [];
  function hash(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) | 0; }
    return "q" + (h >>> 0).toString(36);
  }
  function add(type, topic, q, opts, a, why) {
    Q.push({ id: hash(topic + q), type: type, topic: topic, q: q, opts: opts, a: a, why: why });
  }
  function mc(t, q, o, a, w) { add("mc", t, q, o, a, w); }
  function sata(t, q, o, a, w) { add("sata", t, q, o, a, w); }
  function fill(t, q, acc, w) { add("fill", t, q, null, acc, w); }
  function order(t, q, items, w) { add("order", t, q, items, null, w); }

  /* ---------- ek_bf ---------- */
  mc("ek_bf", "A nurse is completing a home visit to a mother who is 3 days postpartum and breastfeeding her newborn. The mother expresses concern about the amount of weight the newborn has lost since birth. Which of the following is a response the nurse should make?",
    ["\"You might want to offer water supplements between feedings.\"", "\"It is due to the newborn's loss of the influence of the maternal hormones.\"", "\"This might be related to your baby having 3 stools a day.\"", "\"The cause might be too short or infrequent feedings.\""], 3,
    ["This is not an explanation for weight loss. Water supplements are not recommended at this time. The nurse should review the newborn's pattern of breast feeding, the mother's breast feeding technique, and factors that can influence decreased milk production.", "This is not an explanation for weight loss. Breastfed newborns typically lose 5% to 6% of body weight before gaining weight. A delayed period of weight gain might be due to a slower transition from early breast milk to mature milk.", "This is not an explanation for weight loss. The newborn who is being breastfed typically has 3 or more stools per day during the first few weeks.", "Breastfed newborns typically lose 5% to 6% of body weight before gaining weight. Slow weight gain might be due to inadequate breastfeeding, incorrect feeding techniques, or maternal factors such as breasts not emptying, stress, and fatigue."]);
  mc("ek_bf", "A nurse is completing discharge instructions for a new mother and her 2-day-old newborn. The mother asks, \"How will I know if my baby gets enough breast milk?\" Which of the following responses should the nurse make?",
    ["\"Your baby should have a wake cycle of 30 to 60 minutes after each feeding.\"", "\"Your baby should wet 6 to 8 diapers per day.\"", "\"Your baby should burp after each feeding.\"", "\"Your baby should sleep at least 6 hours between feedings.\""], 1,
    ["Babies will typically sleep after a feeding, making this an unreliable indicator that the newborn is getting enough breast milk.", "Newborns should wet 6 to 8 diapers per day. This is an indication that the newborn is getting enough fluids.", "Burping the baby will not ensure the newborn is getting enough breast milk.", "A newborn should eat at least every 4 hr at night; however, length of sleep between feedings is not an indicator that the infant is getting enough breast milk."]);
  mc("ek_bf", "A nurse is assisting a client with breastfeeding. The nurse explains that which of the following reflexes will promote the newborn to latch?",
    ["Babinski", "Rooting", "Moro", "Stepping"], 1,
    ["The Babinski reflex is elicited by stroking upward along the lateral edge of the sole of the newborn's foot. This reflex does not promote the newborn to latch.", "The rooting reflex is elicited when the client strokes the newborn's lips, cheek, or corner of the mouth with her nipple. The newborn will turn his head while making sucking motions with his mouth and latch onto the nipple.", "The Moro reflex is elicited by striking the surface next to the newborn to startle him. This reflex does not promote the newborn to latch.", "The stepping reflex is elicited by holding the newborn vertically with one foot in contact with a surface. The newborn will make leg movements that look like walking. This reflex does not promote the newborn to latch."]);
  mc("ek_bf", "A nurse is caring for a client who is postpartum who asks the nurse when her breast milk will \"come in.\" Which of the following responses should the nurse make?",
    ["Within 2 days", "In 3 to 5 days", "In 6 to 8 days", "In about 10 days"], 1,
    ["In this time frame, most clients who are breastfeeding are still producing colostrum.", "By day 3 to 5, most clients who are breastfeeding begin to produce copious amounts of breast milk.", "Day 6 to 8 is not the usual time frame for the onset of breast milk production.", "Breast milk transitions to mature milk in about 10 days, but clients do produce breast milk before that time."]);
  mc("ek_bf", "A nurse is caring for a client who is breastfeeding and states that her nipples are sore. Which of the following interventions should the nurse suggest?",
    ["Apply mineral oil to the nipples between feedings.", "Keep the nipples covered between breastfeeding sessions.", "Increase the length of time between feedings.", "Change the newborn's position on the nipples with each feeding."], 3,
    ["The client should apply purified lanolin to the nipples after feedings.", "The client should expose sore nipples to the air as much as possible.", "Decreasing the frequency of feedings does not prevent sore nipples or allow time for healing.", "When the client's nipple is sore due to breastfeeding, the client should break the suction with her finger, remove the newborn from the breast, and try a different position. The newborn's mouth should be open wide before connecting with the nipple."]);
  mc("ek_bf", "A nurse is assisting a client who is postpartum with her first breastfeeding experience. When the client asks how much of the nipple she should put into the newborn's mouth, which of the following responses should the nurse make?",
    ["\"You should place your nipple and some of the areola into her mouth.\"", "\"Babies know instinctively how much of the nipple to take into their mouth.\"", "\"Your baby's mouth is rather small so she will only take part of the nipple.\"", "\"Try to place the nipple, the areola, and some breast tissue beyond the areola into her mouth.\""], 0,
    ["Placing the nipple and 2 to 3 cm of areolar tissue around the nipple into the baby's mouth aids in adequately compressing the milk ducts. This placement decreases stress on the nipple and prevents cracking and soreness.", "The client should not rely on the newborn to perfect the breastfeeding technique. The client's knowledge and guidance of the newborn are needed for successful breastfeeding.", "The size of the newborn's mouth has some effect on the ability of the newborn to latch, as do the size of the nipple and the areola. There are general guidelines the client should use to promote successful breastfeeding. If the newborn sucks on only a portion of the nipple, nipple soreness is likely to develop.", "Placing this much of the breast into the newborn's mouth might not be possible, and the client will feel discouraged and unsuccessful in attempting to latch the newborn."]);
  mc("ek_bf", "Which finding indicates a good breastfeeding latch?",
    ["Lips flanged outward and swallowing is heard", "Cheeks dimple inward with clicking sounds", "Only the nipple tip is in the baby's mouth", "The mother feels pinching pain throughout the feed"], 0,
    ["Flanged lips with audible swallowing show effective milk transfer.", "Dimpling and clicking mean the baby is losing suction, which is a shallow latch.", "The mouth should cover the nipple and much of the areola. A nipple-only latch is painful and moves little milk.", "Ongoing pain signals a poor latch. Mild tenderness should ease after the first few sucks."]);
  mc("ek_bf", "A breastfeeding newborn has a shallow latch and the mother's nipples are sore. What should the nurse teach?",
    ["Break suction with a clean finger at the corner of the mouth, then re-latch with more areola", "Pull the baby off quickly and try again", "Switch to formula until the soreness heals", "Soreness is normal and will pass"], 0,
    ["Breaking suction protects the nipple, and re-latching with more areola corrects the shallow latch.", "Pulling without breaking suction injures the nipple.", "Formula is not needed. Fixing the latch solves the problem and protects milk supply.", "Sore nipples are a sign of a poor latch, not something to wait out."]);
  mc("ek_bf", "Which sequence of breast milk is correct?",
    ["Colostrum, transitional milk, mature milk", "Mature milk, colostrum, transitional milk", "Transitional milk, colostrum, mature milk", "Colostrum, mature milk, transitional milk"], 0,
    ["Colostrum comes first and is rich in IgA, transitional milk follows around day 3-4, and mature milk by about day 10.", "This reverses the order. Mature milk is the last stage.", "Transitional milk follows colostrum; it does not come before it.", "Transitional milk is the bridge between colostrum and mature milk."]);
  mc("ek_bf", "Which statement describes foremilk?",
    ["It is watery, lower in fat, and quenches the baby's thirst", "It is thick and highest in fat, released last", "It is only produced in the first 2 days", "It is produced only after 10 days"], 0,
    ["Foremilk is released first and is thin and hydrating.", "This describes hindmilk.", "This describes colostrum.", "This describes mature milk."]);
  mc("ek_bf", "Why should the nurse teach a mother to let the baby finish one breast before offering the other?",
    ["Hindmilk is high in fat and calories and supports weight gain", "Foremilk contains all of the antibodies", "It lowers prolactin levels", "It prevents let-down"], 0,
    ["A full feeding reaches the fat-rich hindmilk that drives growth.", "Antibodies are most concentrated in colostrum, and foremilk is not the reason.", "Emptying the breast keeps prolactin stimulated and supply up.", "Let-down is a hormone response; emptying the breast does not prevent it."]);
  mc("ek_bf", "A mother says her breasts leak when she hears another baby cry. Which hormone is responsible?",
    ["Oxytocin", "Prolactin", "Estrogen", "Progesterone"], 0,
    ["Oxytocin is released by a baby's cry, sight, or suckling and causes let-down.", "Prolactin drives milk production, not the leaking response.", "Estrogen falls after birth and is not the let-down hormone.", "Progesterone drops after the placenta is delivered, which allows lactation to begin."]);
  mc("ek_bf", "Which statement shows understanding of the lactational amenorrhea method (LAM)?",
    ["It works only with exclusive breastfeeding, a baby under 6 months, and no return of menses", "It is reliable for 12 months with any amount of supplementing", "It also protects against STIs", "Ovulation never happens while breastfeeding"], 0,
    ["All three conditions must be met for LAM to be reliable.", "LAM is limited to 6 months and exclusive breastfeeding.", "Only condoms protect against STIs.", "Ovulation can return, especially with supplements or longer gaps between feeds."]);
  sata("ek_bf", "Select teaching points about newborn feeding frequency and intake.",
    ["Breastfeed every 2-3 hours, about 8-12 times in 24 hours", "Wake the baby if 3 hours pass since the last feeding", "Feed on cues such as rooting and hand-to-mouth", "Limit each feeding to 5 minutes per breast", "Expect 6 or more wet diapers daily once milk is in"], [0, 1, 2, 4],
    ["This frequency meets caloric needs and builds supply.", "Waking a sleepy newborn keeps intake adequate.", "Cues show readiness; crying is a late sign.", "Timed limits can stop the baby before reaching hindmilk.", "Six or more wet diapers shows adequate intake."]);
  mc("ek_bf", "A breastfeeding mother asks about birth control. Which method is best avoided early postpartum?",
    ["Combined estrogen-progestin pill", "Progestin-only pill", "Copper IUD", "Condoms"], 0,
    ["Estrogen can lower milk supply, so avoid it early.", "Progestin-only methods do not reduce supply and are appropriate.", "It is hormone-free and has no effect on milk supply.", "Barrier methods have no effect on milk supply."]);

  /* ---------- ek_pp ---------- */
  mc("ek_pp", "A nurse is caring for a client who is 1 hr postpartum and observes a large amount of lochia rubra and several small clots on the client's perineal pad. The fundus is midline and firm at the umbilicus. Which of the following actions should the nurse take?",
    ["Document the findings and continue to monitor the client.", "Notify the client's provider.", "Increase the frequency of fundal massage.", "Encourage the client to empty her bladder."], 0,

  mc("ek_pp", "A nurse is assessing a client who is 3 days postpartum and is breastfeeding. The nurse notes that the fundus is three fingerbreadths below the umbilicus, lochia rubra is moderate, and the breasts are hard and warm to palpation. Which of the following interpretations of these findings should the nurse make?",

    ["Clinical manifestations of mastitis include chills, fever, malaise, and a localized area of breast tenderness.", "For this postpartum day, the client's fundal location and lochia characteristics are within the expected reference range. Breast engorgement is typical, as this is the time when the breasts begin producing milk. Frequent breastfeeding and routine care can help relieve engorgement.", "Heat increases blood flow and can, therefore, increase congestion in breasts that are already engorged. A heating pad should not be offered. However, a warm shower before breastfeeding can help relieve engorgement.", "Wearing a nursing bra helps reduce discomfort due to engorgement."]);

  mc("ek_pp", "A nurse is assessing a client who is 8 hr postpartum and multiparous. Which of the following findings should alert the nurse to the client's need to urinate?",

  mc("ek_pp", "A nurse is caring for a client who is 12 hr postpartum following a vaginal delivery. Which of the following findings should the nurse expect?",

  mc("ek_pp", "A nurse is caring for a client who is postpartum and finds the fundus slightly boggy and displaced to the right. Based on these findings, which of the following actions should the nurse take?",

  mc("ek_pp", "A nurse is caring for a client who is 5 hr postpartum following a vaginal birth of a newborn weighing 9 lb 6 oz. (4252 g). The nurse should recognize that this client is at risk for which of the following postpartum complications?",

  mc("ek_pp", "A nurse is caring for a client who is 4 hr postpartum following a vaginal birth. The client has saturated a perineal pad within 10 min. Which of the following actions should the nurse take first?",

    ["Blood pressure is not a reliable indicator of impending shock from hemorrhage because compensatory mechanisms prevent a significant drop in blood pressure until the client has lost 30 to 40% of her blood volume.", "While a distended bladder can displace the uterus and interfere with contractions, this is not the first action the nurse should take.", "The initial management of excessive uterine bleeding is firm massage of the uterine fundus. This action stimulates contraction of the uterine muscles, which constrict the maternal uterine blood vessels.", "If manual massage of the uterine fundus does not increase contractility and slow bleeding, it would then be appropriate to empty the bladder and administer a continuous IV infusion of oxytocin."]);
  mc("ek_pp", "A nurse is caring for a client who experienced a vaginal birth 3 hr ago. Upon palpation, the fundus is displaced to the right of midline, is firm, and is two fingerbreadths above the umbilicus. Which of the following actions should the nurse complete at this time?",

  mc("ek_pp", "A nurse is admitting a client who experienced a vaginal birth 2 hr ago. The client is receiving an IV of lactated Ringer's with 25 units of oxytocin infusing and has large rubra lochia. Vital signs include blood pressure 146/94 mm Hg, pulse 80/min, and respiratory rate 18/min. The nurse reviews the prescriptions from the provider. Which of the following prescriptions requires clarification?",

  mc("ek_pp", "A nurse is caring for a client who is 2 hr postpartum following a vaginal birth. Which of the following findings indicates the client's bladder is distended?",
    ["Client report of frequent uterine contractions", "Less than 2.5 cm of rubra lochia on perineal pad", "Fundus palpable to right of midline", "Client report of increased thirst"], 2,
    ["Bladder distention can cause uterine atony, which is failure of the uterine muscles to contract. The client would not report experiencing frequent uterine contractions; the fundus would feel boggy to palpation.", "Bladder distention can cause excessive bleeding, which is due to uterine atony. Scant (< 2.5 cm) rubra lochia on the clients perineal pad is consistent with a finding of a firm, contracted uterus and absence of bladder distention.", "Bladder distention results in uterine displacement, pushing the fundus above the umbilicus and away from the midline. The fundus might feel boggy to palpation and does not contract normally.", "Fluid shifts due to decreased estrogen levels, changes in body structure, and blood volume, as well as the length of labor, can result in diaphoresis and increased thirst. They are not associated with bladder distention."]);
  mc("ek_pp", "A nurse is caring for a client who is 12 hr postpartum. Which of the following findings should alert the nurse to the possibility of a postpartum complication?",

    ["A client report of dizziness or feeling faint upon standing is an expected finding in the first 48 hr postpartum. This is the result of large fluid shifts and altered hormone levels.", "At 12 hr after delivery, the fundus should be at the level of the umbilicus, and then it should descend about 1 to 2 cm every 24 hr.", "Profound diuresis is common after delivery due to the decrease in estrogen and the body getting rid of excess fluid volume.", "A rapid or increasing heart rate can be a manifestation of fluid volume depletion related to hemorrhage. The nurse should further evaluate the client for evidence of postpartum hemorrhage."]);
  mc("ek_pp", "A nurse is assessing a client who is 4 hr postpartum following a vaginal delivery. Which of the following findings should the nurse identify as the priority?",

    ["The client will have lochia rubra for the first 1 to 3 days. A saturated perineal pad in 15 min or less can indicate excessive bleeding. Therefore, the nurse should not identify this as the priority finding. The nurse should also monitor for blood under the client's buttocks.", "Deep tendon reflexes 4+ are hyperactive and indicate that the client is at greatest risk for preeclampsia and seizures. The nurse should identify this as the priority finding. The nurse should also monitor for headaches, visual disturbances and epigastric pain. The provider will likely prescribe magnesium sulfate IV infusion.", "The client's fundus should be firm, midline, and at the level of the umbilicus for the first 24 hr after delivery. The fundus will involute approximately 1 cm/day and will descend 1 to 2 cm/day. Therefore, the nurse should not identify this as the priority finding.", "Approximated edges of the episiotomy indicate good wound healing. Therefore, the nurse should not identify this as the priority finding. Redness, warmth, and drainage can indicate infection."]);
  mc("ek_pp", "A nurse is caring for a client who is 2 hr postpartum. The nurse notes that the client soaked a perineal pad in 10 min, the client's skin color is ashen, and she states she feels weak and light headed. After applying oxygen via nonrebreather face mask at 10 L/min which of the following actions should the nurse take next?",

    ["The nurse should insert an indwelling urinary catheter to monitor kidney function. However, there is another action the nurse should take first.", "The client should have two IV catheters for IV fluids and the nurse should either add oxytocin to an existing IV infusion or start an infusion to maintain uterine contractions. However, there is another action the nurse should take first.", "The nurse should tilt the client onto her right side with her legs elevated to at least 30° to promote blood flow back to the heart. However, there is another action the nurse should take first.", "A soaked perineal pad in less than 15 min, ashen skin color, and report of weakness and light headedness can indicate that the client is at greatest risk for hypovolemic shock. Therefore, the next action the nurse should take is to massage the client's fundus to expel blood clots and promote uterine contraction to stop the bleeding."]);

  mc("ek_pp", "A nurse in a clinic is caring for a client who is 3 weeks postpartum following the birth of a healthy newborn. The client reports feeling \"down\" and sad, having no energy, and wanting to cry. Which of the following is a priority action by the nurse?",

  mc("ek_pp", "A nurse is performing a physical examination of a client who is 1 day postpartum. Which of the following findings requires immediate intervention?",
    ["Decreased urge to void", "Increased urine output", "Displaced fundus from the midline", "Fundal height below the umbilicus"], 2,
    ["This is an expected finding in the postpartum period and does not require immediate intervention. Birth trauma, increased bladder capacity after childbirth, and anesthesia can cause a decreased urge to void. Pelvic soreness caused by the forces of labor, vaginal lacerations, or an episiotomy reduces or alters the voiding reflex. The nurse should monitor the client's voiding pattern.", "Within 12 hr of birth, clients begin to lose the excess tissue fluid accumulated during pregnancy. Postpartum diuresis is caused by decreased estrogen levels. This is an expected finding and does not require immediate intervention.", "A distended bladder can cause uterine atony and lateral displacement of the fundus from the midline of the lower abdomen, usually to the right. This requires immediate intervention because the distended bladder pushes the uterus up and to the side, which prevents it from contracting firmly. Uterine atony results from the inability of the uterine muscle to contract adequately after birth. This can lead to postpartum hemorrhage.", "Involution is the return of the uterus to a nonpregnant state. At the end of the third stage of labor, the uterus is in the midline, approximately 2 cm below the level of the umbilicus. Within 12 hr, the fundus rises to approximately the level of the umbilicus. The fundus descends 1 to 2 cm every 24 hr. Therefore, at 1 day postpartum, the fundal height should be 1 to 2 cm (fingerbreadths) below the umbilicus. This is an expected finding and does not require immediate intervention."]);

    if (q.type === "mc") return r === q.a;
    if (q.type === "sata") {
      if (!r || r.length !== q.a.length) return false;
      return q.a.every(function (i) { return r.indexOf(i) !== -1; });
    }
    if (q.type === "fill") {
      var v = norm(r || "");
      return v !== "" && q.a.some(function (x) { return norm(x) === v; });
    }
    if (q.type === "order") return r.every(function (v, i) { return v === i; });
    return false;
  }
  function isAnswered(item) {
    var q = item.q, r = item.resp;
    if (q.type === "mc") return r !== null;
    if (q.type === "sata") return r.length > 0;
    if (q.type === "fill") return String(r).trim() !== "";
    return !!item.touched;
  }
  function makeItem(q) {
    var item = { q: q, checked: false, correct: null, flagged: !!(progress[q.id] && progress[q.id].flag), recorded: false };
    if (q.type === "mc") { item.resp = null; item.shown = shuffle(range(q.opts.length)); }
    else if (q.type === "sata") { item.resp = []; item.shown = shuffle(range(q.opts.length)); }
    else if (q.type === "fill") { item.resp = ""; }
    else {
      var p = shuffle(range(q.opts.length));
      var same = p.every(function (v, i) { return v === i; });
      if (same) p.push(p.shift());
      item.resp = p;
    }
    return item;
  }
  function correctText(q) {
    if (q.type === "mc") return q.opts[q.a];
    if (q.type === "sata") return q.a.map(function (i) { return q.opts[i]; }).join("; ");
    if (q.type === "fill") return q.a[0];
    return q.opts.map(function (t, i) { return (i + 1) + ". " + t; }).join(" ");
  }
  function respText(item) {
    var q = item.q, r = item.resp;
    if (q.type === "mc") return r === null ? "No answer" : q.opts[r];
    if (q.type === "sata") return r.length ? r.slice().sort(function (a, b) { return a - b; }).map(function (i) { return q.opts[i]; }).join("; ") : "No answer";
    if (q.type === "fill") return String(r).trim() === "" ? "No answer" : r;
    return r.map(function (i, n) { return (n + 1) + ". " + q.opts[i]; }).join(" ");
  }
  function record(item) {
    if (item.recorded) return;
    item.recorded = true;
    var p = rec(item.q.id);
    p.seen += 1;
    if (item.correct) p.right += 1;
    p.last = !!item.correct;
  }

  /* ---------- stats ---------- */
  function topicStats() {
    var out = {};
    TOPICS.forEach(function (t) { out[t.id] = { total: 0, seen: 0, seenAttempts: 0, right: 0 }; });
    BANK.forEach(function (q) {
      var s = out[q.topic]; if (!s) return;
      s.total += 1;
      var p = progress[q.id];
      if (p && p.seen) { s.seen += 1; s.seenAttempts += p.seen; s.right += p.right; }
    });
    return out;
  }
  function counts() {
    var missed = 0, flagged = 0;
    BANK.forEach(function (q) {
      var p = progress[q.id];
      if (p && p.last === false) missed++;
      if (p && p.flag) flagged++;
    });
    return { missed: missed, flagged: flagged };
  }

  /* ---------- session state ---------- */
  var S = null;
  var timerId = null;
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

  /* ---------- HOME ---------- */
  function renderHome() {
    stopTimer();
    S = null;
    var stats = topicStats();
    var c = counts();
    var h = "";
    h += "<h2>Practice for Exam 3</h2>";
    h += '<p class="lede">' + BANK.length + " questions on the topics your professor emphasized, each with a rationale for every answer choice. Pick a mode, choose topics, and start. Your progress is saved in this browser.</p>";

    h += '<form id="setup" class="panel" aria-label="Session setup">';
    h += "<fieldset><legend>Mode</legend><div class=\"modes\">";
    h += modeCard("study", "Study", "Answer one at a time and see the rationale right away.", true);
    h += modeCard("exam", "Exam", "Timed, no feedback until you submit. Scored out of 100.", false);
    h += modeCard("marathon", "Marathon", "Every question in your scope, with feedback. Stop whenever you like.", false);
    h += "</div></fieldset>";

    h += '<h3>Topics</h3>';
    Object.keys(CHAPTERS).forEach(function (ch) {
      h += '<div class="chapter"><label class="chapter-head"><input type="checkbox" data-chapter="' + ch + '" checked> ' + esc(CHAPTERS[ch]) + "</label><div class=\"topics\">";
      TOPICS.filter(function (t) { return t.chapter === ch; }).forEach(function (t) {
        var n = stats[t.id].total;
        h += '<label class="chip"><input type="checkbox" name="topic" value="' + t.id + '" checked> ' + esc(t.label) + " <em>" + n + "</em></label>";
      });
      h += "</div></div>";
    });

    h += '<div class="row">';
    h += '<label>Questions <select name="count"><option value="10">10</option><option value="20" selected>20</option><option value="30">30</option><option value="50">50</option><option value="all">All</option></select></label>';
    h += '<label>Include <select name="filter"><option value="all">All questions</option><option value="unseen">Not yet answered</option><option value="missed">Missed last time (' + c.missed + ')</option><option value="flagged">Flagged (' + c.flagged + ')</option></select></label>';
    h += "</div>";
    h += '<div class="actions"><button class="btn" type="submit">Start</button><span id="setupMsg" role="status" class="empty"></span></div>';
    h += "</form>";

    h += '<section class="panel" aria-labelledby="progTitle"><h3 id="progTitle">Your progress by topic</h3><div class="bars">';
    TOPICS.forEach(function (t) {
      var s = stats[t.id];
      var acc = s.seenAttempts ? Math.round((s.right / s.seenAttempts) * 100) : null;
      var cls = acc === null ? "" : acc >= 80 ? "hi" : acc >= 60 ? "mid" : "low";
      var cover = s.total ? Math.round((s.seen / s.total) * 100) : 0;
      h += '<div class="bar-row"><span>' + esc(t.label) + '</span><div class="bar" role="img" aria-label="' + cover + ' percent of questions attempted"><i class="' + cls + '" style="width:' + cover + '%"></i></div><span class="num">' +
        s.seen + "/" + s.total + (acc === null ? "" : " &middot; " + acc + "% correct") + "</span></div>";
    });
    h += '</div><p class="hint">Bar length shows how many questions you have tried. Color shows accuracy: green 80% or higher, amber 60-79%, red below 60%.</p>';
    h += '<div class="actions"><button class="linkbtn" id="resetBtn" type="button">Reset saved progress</button></div></section>';

    app.innerHTML = h;
    document.getElementById("setup").addEventListener("submit", onStart);
    document.getElementById("setup").addEventListener("change", onSetupChange);
    document.getElementById("resetBtn").addEventListener("click", function () {
      if (window.confirm("Clear all saved answers, accuracy, and flags?")) {
        progress = {}; saveProgress(); renderHome();
      }
    });
  }
  function modeCard(id, title, desc, checked) {
    return '<label class="mode"><input type="radio" name="mode" value="' + id + '"' + (checked ? " checked" : "") + "><strong>" + title + "</strong><span>" + desc + "</span></label>";
  }
  function onSetupChange(e) {
    var t = e.target;
    if (t.dataset && t.dataset.chapter) {
      var ch = t.dataset.chapter;
      TOPICS.filter(function (x) { return x.chapter === ch; }).forEach(function (x) {
        var box = document.querySelector('input[name="topic"][value="' + x.id + '"]');
        if (box) box.checked = t.checked;
      });
    }
    if (t.name === "topic") {
      Object.keys(CHAPTERS).forEach(function (ch) {
        var ids = TOPICS.filter(function (x) { return x.chapter === ch; }).map(function (x) { return x.id; });
        var all = ids.every(function (id) { return document.querySelector('input[name="topic"][value="' + id + '"]').checked; });
        document.querySelector('input[data-chapter="' + ch + '"]').checked = all;
      });
    }
  }
  function onStart(e) {
    e.preventDefault();
    var f = e.target;
    var topics = Array.prototype.slice.call(f.querySelectorAll('input[name="topic"]:checked')).map(function (x) { return x.value; });
    var mode = f.querySelector('input[name="mode"]:checked').value;
    var count = f.elements.count.value;
    var filter = f.elements.filter.value;
    var msg = document.getElementById("setupMsg");
    if (!topics.length) { msg.textContent = "Choose at least one topic."; return; }
    var pool = BANK.filter(function (q) {
      if (topics.indexOf(q.topic) === -1) return false;
      var p = progress[q.id];
      if (filter === "unseen") return !p || !p.seen;
      if (filter === "missed") return p && p.last === false;
      if (filter === "flagged") return p && p.flag;
      return true;
    });
    if (!pool.length) { msg.textContent = "No questions match those choices. Try a different filter or topic."; return; }
    startSession(mode, pool, count);
  }

  /* ---------- SESSION ---------- */
  function startSession(mode, pool, count) {
    var qs = shuffle(pool);
    if (mode !== "marathon" && count !== "all") qs = qs.slice(0, parseInt(count, 10));
    S = {
      mode: mode,
      items: qs.map(makeItem),
      i: 0,
      started: Date.now(),
      limit: mode === "exam" ? qs.length * SECONDS_PER_QUESTION : 0,
      finished: false
    };
    renderQuiz();
    if (S.limit) {
      stopTimer();
      timerId = setInterval(tick, 1000);
    }
    window.scrollTo(0, 0);
  }
  function remaining() { return S.limit - Math.floor((Date.now() - S.started) / 1000); }
  function tick() {
    if (!S || S.finished) { stopTimer(); return; }
    var left = remaining();
    var el = document.getElementById("timer");
    if (el) { el.textContent = fmtTime(left); el.classList.toggle("low", left <= 60); }
    if (left <= 0) { finish(true); }
  }

  function stripHtml() {
    var n = S.items.length;
    if (n > STRIP_MAX) {
      var done = S.items.filter(function (it) { return S.mode === "exam" ? isAnswered(it) : it.checked; }).length;
      return '<div class="plainbar" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + done + '" aria-label="Questions answered"><i style="width:' + Math.round((done / n) * 100) + '%"></i></div>';
    }
    var h = '<div class="strip" role="group" aria-label="Question progress">';
    S.items.forEach(function (it, idx) {
      var cls = "beat";
      if (S.mode !== "exam" && it.checked) cls += it.correct ? " right" : " wrong";
      else if (S.mode === "exam" && isAnswered(it)) cls += " seen";
      if (it.flagged) cls += " flagged";
      if (idx === S.i) cls += " current";
      var label = "Question " + (idx + 1) + (it.flagged ? ", flagged" : "") + (idx === S.i ? ", current" : "");
      h += '<button type="button" class="' + cls + '" data-go="' + idx + '" aria-label="' + label + '"><svg viewBox="0 0 28 30" aria-hidden="true"><path d="M0 20 H8 L10 17 L12 20 H14 L16 4 L19 26 L21 20 H24 L26 18 L28 20"/></svg></button>';
    });
    return h + "</div>";
  }
  function bindStrip() {
    document.querySelectorAll("[data-go]").forEach(function (b) {
      b.addEventListener("click", function () { S.i = parseInt(b.dataset.go, 10); renderQuiz(); window.scrollTo(0, 0); });
    });
  }
  function refreshStrip() {
    var el = document.getElementById("stripHost");
    if (el) { el.innerHTML = stripHtml(); bindStrip(); }
  }

  function renderQuiz(focusSel) {
    var it = S.items[S.i], q = it.q;
    var showFB = it.checked && S.mode !== "exam";
    var h = '<div id="stripHost">' + stripHtml() + "</div>";
    h += '<section class="panel' + (showFB ? " locked" : "") + '" aria-live="off">';
    h += '<div class="meta"><span>Question ' + (S.i + 1) + " of " + S.items.length + '</span><span class="tag">' + esc(topicById[q.topic].label) + "</span>";
    if (S.limit) h += '<span class="timer" id="timer" role="timer">' + fmtTime(remaining()) + "</span>";
    h += "</div>";
    h += '<p class="stem" id="stem">' + esc(q.q) + "</p>";
    if (q.type === "sata") h += '<p class="hint">Select all that apply.</p>';
    if (q.type === "order") h += '<p class="hint">Use the arrows to put the steps in the correct order, first at the top.</p>';

    if (q.type === "mc" || q.type === "sata") h += optionsHtml(it, showFB);
    else if (q.type === "fill") {
      var cls = showFB ? (it.correct ? " right" : " wrong") : "";
      h += '<input class="fill' + cls + '" id="fillBox" type="text" autocomplete="off" aria-labelledby="stem" value="' + esc(it.resp) + '"' + (showFB ? " disabled" : "") + ">";
    } else h += orderHtml(it, showFB);

    if (showFB) {
      h += '<div class="feedback ' + (it.correct ? "right" : "wrong") + '" role="status"><strong>' + (it.correct ? "Correct" : "Not quite") + "</strong>";
      if (!it.correct) h += "<p>Correct answer: " + esc(correctText(q)) + "</p>";
      h += whyHtml(q) + '<p class="ref">Review: ' + esc(topicById[q.topic].ref) + " in your notes</p></div>";
    }

    h += '<div class="actions">';
    h += '<button class="btn ghost" type="button" id="prevBtn"' + (S.i === 0 ? " disabled" : "") + ">Previous</button>";
    if (S.mode !== "exam" && !it.checked) h += '<button class="btn" type="button" id="checkBtn"' + (isAnswered(it) ? "" : " disabled") + ">Check answer</button>";
    else if (S.i < S.items.length - 1) h += '<button class="btn" type="button" id="nextBtn">Next question</button>';
    else if (S.mode === "exam") h += '<button class="btn" type="button" id="finishBtn">Submit exam</button>';
    else h += '<button class="btn" type="button" id="finishBtn">See results</button>';
    h += '<button class="btn ghost" type="button" id="flagBtn" aria-pressed="' + it.flagged + '">' + (it.flagged ? "Unflag" : "Flag for review") + "</button>";
    h += '<span class="spacer"></span>';
    if (S.mode === "exam" && S.i < S.items.length - 1) h += '<button class="btn ghost" type="button" id="finishBtn">Submit exam</button>';
    else if (S.mode !== "exam") h += '<button class="btn ghost" type="button" id="finishBtn2">End session</button>';
    h += "</div></section>";

    app.innerHTML = h;
    bindQuiz();
    if (focusSel) { var f = document.querySelector(focusSel); if (f) f.focus(); }
  }

  function optionsHtml(it, showFB) {
    var q = it.q;
    var h = '<ul class="opts" role="group" aria-labelledby="stem">';
    it.shown.forEach(function (oi) {
      var chosen = q.type === "mc" ? it.resp === oi : it.resp.indexOf(oi) !== -1;
      var isRight = q.type === "mc" ? q.a === oi : q.a.indexOf(oi) !== -1;
      var cls = "opt", mark = "";
      if (showFB) {
        if (chosen && isRight) { cls += " right"; mark = "Correct"; }
        else if (chosen && !isRight) { cls += " wrong"; mark = "Incorrect"; }
        else if (!chosen && isRight) { cls += " missed"; mark = "Correct answer"; }
      }
      var type = q.type === "mc" ? "radio" : "checkbox";
      h += '<li><label class="' + cls + '"><input type="' + type + '" name="opt" value="' + oi + '"' + (chosen ? " checked" : "") + (showFB ? " disabled" : "") + "><span>" + esc(q.opts[oi]) + "</span>" + (mark ? '<span class="mark">' + mark + "</span>" : "") + "</label></li>";
    });
    return h + "</ul>";
  }
  function orderHtml(it, showFB) {
    var q = it.q;
    var h = '<ol class="seq">';
    it.resp.forEach(function (oi, pos) {
      var cls = "";
      if (showFB) cls = oi === pos ? "right" : "wrong";
      h += '<li class="' + cls + '"><span class="pos">' + (pos + 1) + '</span><span class="txt">' + esc(q.opts[oi]) + "</span>";
      if (!showFB) {
        h += '<button type="button" data-move="up" data-pos="' + pos + '" aria-label="Move up"' + (pos === 0 ? " disabled" : "") + ">&uarr;</button>";
        h += '<button type="button" data-move="down" data-pos="' + pos + '" aria-label="Move down"' + (pos === it.resp.length - 1 ? " disabled" : "") + ">&darr;</button>";
      }
      h += "</li>";
    });
    return h + "</ol>";
  }

  function bindQuiz() {
    var it = S.items[S.i], q = it.q;
    var on = function (id, fn) { var el = document.getElementById(id); if (el) el.addEventListener("click", fn); };

    bindStrip();
    document.querySelectorAll('input[name="opt"]').forEach(function (inp) {
      inp.addEventListener("change", function () {
        var v = parseInt(inp.value, 10);
        if (q.type === "mc") it.resp = v;
        else {
          var idx = it.resp.indexOf(v);
          if (inp.checked && idx === -1) it.resp.push(v);
          if (!inp.checked && idx !== -1) it.resp.splice(idx, 1);
        }
        afterAnswerChange();
      });
    });
    var fb = document.getElementById("fillBox");
    if (fb) {
      fb.addEventListener("input", function () { it.resp = fb.value; afterAnswerChange(); });
      fb.addEventListener("keydown", function (e) { if (e.key === "Enter" && S.mode !== "exam") { e.preventDefault(); doCheck(); } });
    }
    document.querySelectorAll("[data-move]").forEach(function (b) {
      b.addEventListener("click", function () {
        var pos = parseInt(b.dataset.pos, 10), to = b.dataset.move === "up" ? pos - 1 : pos + 1;
        var t = it.resp[pos]; it.resp[pos] = it.resp[to]; it.resp[to] = t;
        it.touched = true;
        afterAnswerChange();
        renderQuiz('[data-move="' + b.dataset.move + '"][data-pos="' + to + '"]');
      });
    });

    on("prevBtn", function () { S.i -= 1; renderQuiz(); window.scrollTo(0, 0); });
    on("nextBtn", function () { S.i += 1; renderQuiz(); window.scrollTo(0, 0); });
    on("checkBtn", doCheck);
    on("flagBtn", function () {
      it.flagged = !it.flagged;
      rec(q.id).flag = it.flagged;
      saveProgress();
      renderQuiz("#flagBtn");
    });
    on("finishBtn", function () { confirmFinish(); });
    on("finishBtn2", function () { confirmFinish(); });
  }
  function afterAnswerChange() {
    var it = S.items[S.i];
    var btn = document.getElementById("checkBtn");
    if (btn) btn.disabled = !isAnswered(it);
    if (S.mode === "exam") refreshStrip();
  }
  function doCheck() {
    var it = S.items[S.i];
    if (!isAnswered(it) || it.checked) return;
    it.checked = true;
    it.correct = evaluate(it);
    record(it);
    saveProgress();
    renderQuiz("#nextBtn, #finishBtn");
    var fbEl = document.querySelector(".feedback");
    if (fbEl && fbEl.scrollIntoView) fbEl.scrollIntoView({ block: "nearest" });
  }
  function confirmFinish() {
    var unanswered = S.items.filter(function (x) { return S.mode === "exam" ? !isAnswered(x) : !x.checked; }).length;
    var msg = S.mode === "exam"
      ? (unanswered ? "You have " + unanswered + " unanswered question(s). Submit the exam anyway?" : "Submit the exam?")
      : "End this session and see your results?";
    if (window.confirm(msg)) finish(false);
  }

  /* ---------- RESULTS ---------- */
  function finish(timedOut) {
    stopTimer();
    S.finished = true;
    S.timedOut = !!timedOut;
    S.elapsed = Math.floor((Date.now() - S.started) / 1000);
    S.items.forEach(function (it) {
      if (S.mode === "exam" && !it.checked) {
        it.checked = true;
        it.correct = isAnswered(it) ? evaluate(it) : false;
        record(it);
      }
    });
    saveProgress();
    renderResults();
    window.scrollTo(0, 0);
  }
  function renderResults() {
    var counted = S.items.filter(function (it) { return it.checked; });
    var right = counted.filter(function (it) { return it.correct; }).length;
    var total = S.mode === "exam" ? S.items.length : counted.length;
    var pct = total ? Math.round((right / total) * 100) : 0;
    var h = "<h2>" + (S.mode === "exam" ? "Exam results" : "Session results") + "</h2>";
    if (S.timedOut) h += '<p class="lede">Time ran out, so unanswered questions were scored as incorrect.</p>';
    h += '<section class="panel"><div class="score"><span class="big">' + pct + '%</span><span>' + right + " of " + total + " correct" +
      (S.mode === "exam" ? " &middot; " + Math.round((right / (total || 1)) * 100) + " / 100 points" : "") +
      " &middot; " + fmtTime(S.elapsed) + "</span></div>";
    if (!total) h += '<p class="empty">You ended the session before checking any answers.</p>';

    var byTopic = {};
    counted.forEach(function (it) {
      var t = it.q.topic;
      byTopic[t] = byTopic[t] || { n: 0, r: 0 };
      byTopic[t].n += 1; if (it.correct) byTopic[t].r += 1;
    });
    var keys = Object.keys(byTopic);
    if (keys.length) {
      h += "<h3>By topic</h3><div class=\"bars\">";
      keys.forEach(function (k) {
        var s = byTopic[k], a = Math.round((s.r / s.n) * 100);
        var cls = a >= 80 ? "hi" : a >= 60 ? "mid" : "low";
        h += '<div class="bar-row"><span>' + esc(topicById[k].label) + '</span><div class="bar" role="img" aria-label="' + a + ' percent correct"><i class="' + cls + '" style="width:' + a + '%"></i></div><span class="num">' + s.r + "/" + s.n + " &middot; " + a + "%</span></div>";
      });
      h += "</div>";
    }
    var missed = counted.filter(function (it) { return !it.correct; });
    h += '<div class="actions">';
    if (missed.length) h += '<button class="btn" type="button" id="retryBtn">Retry ' + missed.length + " missed in Study mode</button>";
    h += '<button class="btn ghost" type="button" id="homeBtn">Back to setup</button></div></section>';

    h += "<h3>Review every question</h3><div class=\"review\">";
    S.items.forEach(function (it, i) {
      var q = it.q;
      h += "<details" + (it.checked && !it.correct ? " open" : "") + "><summary><span class=\"" + (it.correct ? "ok" : "no") + '">' + (it.correct ? "Correct" : "Missed") + "</span><span>" + (i + 1) + ". " + esc(q.q) + "</span></summary><div class=\"body\">";
      h += "<p><strong>Your answer:</strong> " + esc(it.checked || S.mode === "exam" ? respText(it) : "Not answered") + "</p>";
      h += "<p><strong>Correct answer:</strong> " + esc(correctText(q)) + "</p>";
      h += whyHtml(q) + '<p class="hint">Review: ' + esc(topicById[q.topic].ref) + "</p></div></details>";
    });
    h += "</div>";
    app.innerHTML = h;

    var rb = document.getElementById("retryBtn");
    if (rb) rb.addEventListener("click", function () {
      startSession("study", missed.map(function (it) { return it.q; }), "all");
    });
    document.getElementById("homeBtn").addEventListener("click", renderHome);
  }

  document.getElementById("homeLink").addEventListener("click", function () {
    if (S && !S.finished && !window.confirm("Leave this session? Unchecked answers will be lost.")) return;
    renderHome();
  });

  if (!BANK.length) {
    app.innerHTML = '<p class="empty">The question bank did not load. Make sure data/questions.js is next to index.html.</p>';
  } else {
    renderHome();
  }
})();

</script>
</body>
</html>
