  /* ---------- PRENATAL, LABOR AND DELIVERY (EARLIER EXAMS) ---------- */
  mc("prenatal", "A nurse is caring for a client who is at 36 weeks of gestation and who has a suspected placenta previa. Which of the following findings support this diagnosis?",
    ["Painless red vaginal bleeding", "Increasing abdominal pain with a nonrelaxed uterus", "Abdominal pain with scant red vaginal bleeding", "Intermittent abdominal pain following passage of bloody mucus"], 0,
    "Placenta previa is a condition of pregnancy when the placenta implants in the lower part of the uterus, partly or completely obstructing the cervical os (outlet to the vagina). Bright red, painless vaginal bleeding occurs in the second and third trimester.");
  mc("prenatal", "A nurse in a prenatal clinic is caring for a client who is at 7 weeks of gestation. The client reports urinary frequency and asks if this will continue until delivery. Which of the following responses should the nurse make?",
    ["\"It's a minor inconvenience, which you should ignore.\"", "\"In most cases it only lasts until the 12th week, but it will continue if you have poor bladder tone.\"", "\"There is no way to predict how long it will last in each individual client.\"", "\"It occurs during the first trimester and near the end of the pregnancy.\""], 3,
    "Urinary frequency is due to increased bladder sensitivity during the first trimester and recurs near the end of the pregnancy as the enlarging uterus places pressure on the bladder.");
  mc("prenatal", "A nurse is caring for a client during the first trimester of pregnancy. After reviewing the client's blood work, the nurse notices she does not have immunity to rubella. Which of the following times should the nurse understand is recommended for rubella immunization?",
    ["Shortly after giving birth", "In the third trimester", "Immediately", "During her next attempt to get pregnant"], 0,
    "The rubella immunization should be offered to the client following birth, preferably prior to discharge from the hospital. This prevents the client from contracting rubella during the current or subsequent pregnancies, which would put her fetus at risk for rubella syndrome.");
  mc("prenatal", "A nurse is caring for an antepartum client whose laboratory findings indicate a negative rubella titer. Which of the following is the correct interpretation of this data?",
    ["The client is not experiencing a rubella infection at this time.", "The client is immune to the rubella virus.", "The client requires a rubella vaccination at this time.", "The client requires a rubella immunization following delivery."], 3,
    "A negative rubella titer indicates that the client is susceptible to the rubella virus and needs vaccination following delivery. Immunization during pregnancy is contraindicated because of possible injury to the developing fetus. Following rubella immunization, the client should be cautioned not to conceive for 1 month.");
  mc("prenatal", "A nurse in a hospital is caring for a client who is at 38 weeks of gestation and has a large amount of painless, bright red vaginal bleeding. The client is placed on a fetal monitor indicating a regular fetal heart rate of 138/min and no uterine contractions. The client's vital signs are: blood pressure 98/52 mm Hg, heart rate 118/min, respiratory rate 24/min, and temperature 36.4¡ C (97.6¡ F). Which of the following is the priority nursing action?",
    ["Insert an indwelling urinary catheter.", "Initiate IV access.", "Witness the signature for informed consent for surgery.", "Prepare the abdominal and perineal areas."], 1,
    "Insertion of a large-bore IV catheter is the priority nursing action. The client is losing blood rapidly, has hypotension, and tachycardia. IV access will allow IV fluids and blood to be administered quickly if hypovolemia develops.");
  mc("prenatal", "A nurse in a prenatal clinic is caring for a client who is suspected of having a hydatidiform mole. Which of the following findings should the nurse expect to observe in this client?",
    ["Rapid decline in human chorionic gonadotropin (hCG) levels", "Profuse, clear vaginal discharge", "Irregular fetal heart rate", "Excessive uterine enlargement"], 3,
    "A hydatidiform mole is a rare tumor that forms inside the uterus at the beginning of a pregnancy and results in the over-production of tissue that would normally develop into the placenta. This tissue consists of fluid-filled vesicles. A rapidly enlarging uterus is a classic finding in clients who have a molar pregnancy. It is often accompanied by severe nausea and vomiting, elevated human chorionic gonadotropin levels, signs of hyperthyroidism, and early onset of preeclampsia.");
  mc("prenatal", "A nurse is caring for a client who is having a nonstress test performed. The fetal heart rate (FHR) is 130 to 150/min, but there has been no fetal movement for 15 min. Which of the following actions should the nurse perform?",
    ["Immediately report the situation to the client's provider and prepare the client for induction of labor.", "Encourage the client to walk around without the monitoring unit for 10 min, then resume monitoring.", "Offer the client a snack of orange juice and crackers.", "Turn the client onto her left side."], 2,
    "A nonstress test depends upon fetal movement, and this fetus is most likely asleep. Most fetuses are more active after meals due to the increase in the mother's blood sugar. Giving the mother a snack will promote fetal movement.");
  mc("prenatal", "A nurse on a labor unit is admitting a client who reports painful contractions. The nurse determines that the contractions have a duration of 1 min and a frequency of 3 min. The nurse obtains the following vital signs: fetal heart rate 130/min, maternal heart rate 128/min and maternal blood pressure 92/54 mm Hg. Which of the following is the priority action for the nurse to take?",
    ["Notify the provider of the findings.", "Position the client with one hip elevated.", "Ask the client if she needs pain medication.", "Have the client void."], 1,
    "Based on Maslow's hierarchy of needs, the client's need for an adequate blood pressure to perfuse herself and her fetus is a physiological need that requires immediate intervention. Supine hypotension is a frequent cause of low blood pressure in clients who are pregnant. By turning the client on her side and retaking her blood pressure, the nurse is attempting to correct the low blood pressure and reassess.");
  mc("prenatal", "A nurse is caring for a client who is a primigravida, at term, and having contractions but is stating that she is \"not really sure if she is in labor or not.\" Which of the following should the nurse recognize as a sign of true labor?",
    ["Rupture of the membranes", "Changes in the cervix", "Station of the presenting part", "Pattern of contractions"], 1,
    "Assessment of progressive changes in the effacement and dilation of the cervix is the most accurate indication of true labor.");
  mc("prenatal", "A nurse in the ambulatory surgery center is providing discharge teaching to a client who had a dilation and curettage (D&C) following a spontaneous miscarriage. Which of the following should be included in the teaching?",
    ["Vaginal intercourse can be resumed after 2 weeks.", "Products of conception will be present in vaginal bleeding.", "Increased intake of zinc-rich foods is recommended.", "Aspirin may be taken for cramps."], 0,
    "The client should avoid vaginal intercourse and the use of tampons for 2 weeks following discharge.");
  mc("prenatal", "A nurse is caring for an adolescent client who is gravida 1 and para 0. The client was admitted to the hospital at 38 weeks of gestation with a diagnosis of preeclampsia. Which of the following findings should the nurse identify as inconsistent with preeclampsia?",
    ["1+ pitting sacral edema", "3+ protein in the urine", "Blood pressure 148/98 mm Hg", "Deep tendon reflexes of +1"], 3,
    "Deep tendon reflexes of +1 are decreased. In a client who has preeclampsia, the nurse should expect to find an increased, rather than a decreased, deep tendon reflex.");
  mc("prenatal", "A nurse is caring for a client who is in her first trimester of pregnancy and asks the nurse if she can continue to exercise during pregnancy. Which of the following responses by the nurse is appropriate?",
    ["\"Exercising during pregnancy is not recommended.\"", "\"Daily jogging for up to 30 minutes is fine throughout the pregnancy.\"", "\"Activities that raise the body temperature, such as saunas and hot tubs, are safe until the third trimester.\"", "\"It is recommended that pregnant clients limit their exercise routine to stretching activities on a mat several times a week.\""], 1,
    "While weight-bearing exercises might become uncomfortable in the last trimester, they are generally not contraindicated, providing the client stays hydrated and avoids becoming overheated for extended periods.");
  mc("prenatal", "A nurse at a prenatal clinic is caring for a client who is in her first trimester of pregnancy. The client tells the nurse that she is upset because, although she and her husband planned this pregnancy, she has been having many doubts and second thoughts about the upcoming changes in her life. Which of the following is an appropriate response by the nurse?",
    ["\"Ambivalent feelings are quite common for women early in pregnancy.\"", "\"Perhaps you should see a counselor to discuss these feelings further.\"", "\"Have you spoken to your mother about these feelings?\"", "\"Don't worry. You will be fine once the baby is born.\""], 0,
    "This response uses the therapeutic communication technique of providing information while addressing the client's concerns and feelings. This statement is true and gives the client the information she needs; many antepartum women experience similar feelings in early pregnancy.");
  mc("prenatal", "A nurse is caring for several clients. The nurse should recognize that it is safe to administer tocolytic therapy to which of the following clients?",
    ["A client who is experiencing fetal death at 32 weeks of gestation", "A client who is experiencing preterm labor at 26 weeks of gestation", "A client who is experiencing Braxton-Hicks contractions at 36 weeks of gestation", "A client who has a post-term pregnancy at 42 weeks of gestation"], 1,
    "Tocolytic medications, such as terbutaline, indomethacin, and nifedipine are used to relax the uterus in preterm labor. A client who is in preterm labor at 26 weeks of gestation is a candidate for tocolytic therapy.");
  mc("prenatal", "A nurse is caring for a client who is at 6 weeks of gestation with her first pregnancy and asks the nurse when she can expect to experience quickening. Which of the following responses should the nurse make?",
    ["\"This will occur during the last trimester of pregnancy.\"", "\"This will happen by the end of the first trimester of pregnancy.\"", "\"This will occur between the fourth and fifth months of pregnancy.\"", "\"This will happen once the uterus begins to rise out of the pelvis.\""], 2,
    "Quickening is defined as the first time the client is able to feel her fetus move. In a primigravida client, this usually occurs at 18 weeks of gestation or later. In a multigravida client, this can occur as early as 14 to 16 weeks.");
  mc("prenatal", "A nurse is instructing a female client about how to check basal temperature in order to determine if the client is ovulating. The nurse should instruct the client to check her temperature at which of the following times?",
    ["Every morning before arising", "On days 13 to 17 of her menstrual cycle", "1 hour following intercourse", "Before going to bed every night"], 0,
    "To measure basal temperature, the client must take her temperature every morning at the same exact time before getting out of bed. The client must try not to move too much, as any activity can raise the body temperature slightly.");
  mc("prenatal", "A nurse is caring for a client who is in labor and has an external fetal monitor. The nurse observes late decelerations on the monitor strip and interprets them as indicating which of the following?",
    ["Uteroplacental insufficiency", "Maternal bradycardia", "Umbilical cord compression", "Fetal head compression"], 0,
    "The pattern of the fetal heart rate during labor is an indicator of fetal well-being. Late decelerations are the result of uteroplacental insufficiency and the fetus becomes hypoxemic. They are an ominous sign if they cannot be corrected and place the fetus at risk for a low Apgar score.");
  mc("prenatal", "A nurse is caring for an adolescent client who has pelvic inflammatory disease as a consequence of a sexually transmitted infection, and will need intravenous antibiotic therapy. The client tells the nurse, \"My parents think I am a virgin. I don't think I can tell them I have this kind of an infection.\" Which of the following responses should the nurse make?",
    ["\"Give your parents a chance; they'll understand.\"", "\"If you want me to, I can tell your parents for you.\"", "\"You seem scared to talk to your parents.\"", "\"Your parents will have to be told why you are being admitted.\""], 2,
    "This is an open-ended therapeutic statement that focuses on the adolescent's concern and allows for further exploration of the client's fear of telling her parents that she is sexually active.");
  mc("prenatal", "A nurse in a prenatal clinic is teaching a client who has a new prescription for dinoprostone gel. Which of the following statements should the nurse include in the teaching?",
    ["\"This medication promotes softening of the cervix.\"", "\"This medication is used to treat preeclampsia.\"", "\"It causes relaxation of the uterine muscles.\"", "\"It is used to treat genital herpes simplex virus.\""], 0,
    "Dinoprostone is used to prepare (or ripen) the cervix for the induction of labor in clients who are at term.");
  mc("prenatal", "A nurse is caring for a client who is scheduled for a maternal serum alpha-fetoprotein test at 15 weeks of gestation. The nurse provides which of the following explanations about this test to the client?",
    ["This test assesses fetal lung maturity.", "It assesses various markers of fetal well-being.", "This test identifies an Rh incompatibility between the mother and fetus.", "It is a screening test for spinal defects in the fetus."], 3,
    "The maternal serum alpha-fetoprotein (MSAFP) screening test is used to identify suspected neural tube defects (NTDs) and abdominal wall defects. These include spina bifida, microcephaly, and anencephaly. This tool is the basis for further testing, such as amniocentesis and specialized ultrasounds.");
  mc("prenatal", "A nurse is caring for a client who has a positive pregnancy test. The nurse is teaching the client about common discomforts in the first trimester of pregnancy as well as warning signs of potential danger. The nurse should instruct the client to call the clinic if she experiences which of the following manifestations?",
    ["Leukorrhea", "Urinary frequency", "Nausea and vomiting", "Facial edema"], 3,
    "Facial edema is a warning sign of a hypertensive condition or preeclampsia and should be reported immediately to the provider.");
  mc("prenatal", "A nurse is caring for a client who has a suspected ectopic pregnancy at 8 weeks of gestation. Which of the following manifestations should the nurse expect to identify as consistent with the diagnosis?",
    ["Severe nausea and vomiting", "Large amount of vaginal bleeding", "Unilateral, cramp-like abdominal pain", "Uterine enlargement greater than expected for gestational age"], 2,
    "An ectopic pregnancy is one in which the fertilized egg implants in tissue outside of the uterus and the placenta and fetus begin to develop in this area. The most common site is within a fallopian tube; however, ectopic pregnancies can occur in the ovary, the abdomen, and in the cervix.");
  mc("prenatal", "A nurse is completing discharge teaching to a client in her 35th week of pregnancy who has mild preeclampsia. Which of the following information about nutrition should be included in the teaching?",
    ["Consume 40 to 50 g of protein daily.", "Avoid salting of foods during cooking.", "Drink 48 to 64 ounces of water daily.", "Limit intake of whole grains, raw fruits, and vegetables."], 2,
    "The client who has preeclampsia is encouraged to drink six to eight 8-ounce glasses of water (48 to 64 ounces) per day. She should avoid alcohol and limit intake of caffeinated beverages.");
  mc("prenatal", "A nurse in a college health clinic is speaking to a group of adolescents about toxic shock syndrome (TSS). Which of the following should the nurse include in the teaching as increasing the risk for contracting TSS?",
    ["High-absorbency tampons", "Mosquito bites", "Travel to foreign countries", "Multiple sexual partners"], 0,
    "Toxic shock syndrome, a severe disease caused by a toxin made by Staphylococcus aureus, is characterized by shock and multiple organ dysfunction. Approximately 50% of all cases involve menstruating women using highly absorbent tampons.");
  mc("prenatal", "A nurse in a community clinic is counseling a client who received a positive test result for chlamydia. Which of the following statements should the nurse provide?",
    ["\"This infection is treated with one dose of azithromycin.\"", "\"If your sexual partner has no symptoms, no medication is needed.\"", "\"You have to avoid sexual relations for 3 days.\"", "\"You need to return in 6 months for retesting.\""], 0,
    "A single dose of azithromycin is an appropriate treatment for a chlamydial infection. An acceptable alternative is doxycycline twice a day for 7 days.");
  mc("prenatal", "A nurse is providing preconception counseling for a client who is planning a pregnancy. Which of the following supplements should the nurse recommend to help prevent neural tube defects in the fetus?",
    ["Calcium", "Iron", "Vitamin C", "Folic acid"], 3,
    "Adequate amounts of folic acid before conception and during the first trimester of pregnancy are necessary for fetal neural tube development. This vitamin helps prevent spina bifida and other neurological disorders.");
  sata("prenatal", "A nurse in a prenatal clinic is completing a skin assessment of a client who is in the second trimester. Which of the following findings should the nurse expect? (Select all that apply.)",
    ["Eczema", "Psoriasis", "Linea nigra", "Chloasma", "Striae gravidarum"], [2, 3, 4],
    "<b>Eczema is incorrect.</b> Eczema manifests as red, swollen, and itchy skin and is not an expected finding during pregnancy.<br><br><b>Psoriasis is incorrect.</b> Psoriasis manifests as thick red patches or plagues covered by silver scales on the skin and is not an expected finding during pregnancy.<br><br><b>Linea nigra is correct.</b> Linea nigra manifests as a line of pigmentation extending from the symphysis pubis to the top of the fundus and is an expected finding during pregnancy.<br><br><b>Chloasma is correct.</b> Chloasma, or the mask of pregnancy, manifests as blotchy, brownish hyperpigmentation of the skin over the forehead, nose, and cheeks and is an expected finding during pregnancy.<br><br><b>Striae gravidarum is correct.</b> Striae gravidarum, or stretch marks, occur because of the separation of underlying connective tissue on the breasts, thighs, and abdomen. They are an expected finding during pregnancy.");
  sata("prenatal", "A nurse in a clinic is assessing a client who is at 8 weeks of gestation and has hyperemesis gravidarum. Which of the following findings should the nurse expect? (Select all that apply.)",
    ["History of migraines", "Nulliparous", "Twin gestations", "History of gestational hypertension", "Oligohydramnios"], [0, 1, 2],
    "Answer key taken from your question bank. Review this topic in your notes.");
  mc("prenatal", "A nurse is assessing a client who is in active labor and notes that the presenting part is at 0 station. Which of the following is the correct interpretation of this clinical finding?",
    ["The fetal head is in the left occiput posterior position.", "The largest fetal diameter has passed through the pelvic outlet.", "The posterior fontanel is palpable.", "The lowermost portion of the fetus is at the level of the ischial spines."], 3,
    "The presenting part is at 0 station when its lowermost portion is at the level of an imaginary line drawn between the client's ischial spines. Levels above the ischial spines are negative values: -1, -2, -3. Levels below the ischial spines are positive values: +1, +2, +3.");
  mc("prenatal", "A nurse is providing teaching about nutrition to a client at her first prenatal visit. Which of the following statements by the nurse should be included in the teaching?",
    ["\"You will need to increase your calcium intake during breast feeding.\"", "\"Prenatal vitamins will meet your need for increased vitamin D during pregnancy.\"", "\"Vitamin E requirements decline during pregnancy due to the increase in body fat.\"", "\"You will need to double your intake of iron during pregnancy.\""], 3,
    "During pregnancy, the need for iron increases to allow transfer of the appropriate amounts to the fetus and to support expansion of the client's red blood cell volume.");
  mc("prenatal", "A nurse is caring for a client at the first prenatal visit who has a BMI of 26.5. The client asks how much weight she should gain during pregnancy. Which of the following responses should the nurse make?",
    ["\"It would be best if you gained about 11 to 20 pounds.\"", "\"The recommendation for you is about 15 to 25 pounds.\"", "\"A gain of about 25 to 35 pounds is recommended for you.\"", "\"A gain of about 1 pound per week is the best pattern for you.\""], 1,
    "Clients who are overweight, having a BMI of 25 to 29.9, should be advised that the recommended weight gain is 7 to 11.5 kg (15 to 25 lb). The pattern of weight gain is also important, with minimal gain in the first trimester.");
  mc("prenatal", "A nurse is providing teaching about Kegel exercises to a group of clients who are in the third trimester of pregnancy. Which of the following statements by a client indicates understanding of the teaching?",
    ["\"These exercises help prevent constipation.\"", "\"These exercises help pelvic muscles to stretch during birth.\"", "\"They can help reduce back aches.\"", "\"They can prevent further stretch marks.\""], 1,
    "Kegel exercises improve the strength of perineal muscles, facilitating stretching and contracting during childbirth.");
  mc("prenatal", "A nurse is caring for a client who is in the first stage of labor, undergoing external fetal monitoring, and receiving IV fluid. The nurse observes variable decelerations in the fetal heart rate on the monitor strip. Which of the following is a correct interpretation of this finding?",
    ["Variable decelerations are due to umbilical cord compression.", "Variable decelerations are caused by uteroplacental insufficiency.", "Variable decelerations are a result of the administration of IV narcotic analgesics.", "Variable decelerations are related to fetal head compression."], 0,
    "Variable decelerations are decreases in the fetal heart rate with an abrupt onset, followed by a gradual return to baseline. Variable decelerations coincide with umbilical cord compression, which decreases the oxygen supply to the fetus.");
  mc("prenatal", "A nurse is caring for a client who is at 39 weeks of gestation and is in active labor. The nurse locates the fetal heart tones above the client's umbilicus at midline. The nurse should suspect that the fetus is in which of the following positions?",
    ["Cephalic", "Transverse", "Posterior", "Frank breech"], 3,
    "With a frank breech presentation, the fetal heart is generally above the level of the client's umbilicus.");
  sata("prenatal", "A nurse is caring for a client who is to undergo a biophysical profile. The client asks the nurse what is being evaluated during this test. Which of the following should the nurse include? (Select all that apply.)",
    ["Fetal breathing", "Fetal motion", "Fetal neck translucency", "Amniotic fluid volume", "Fetal gender"], [0, 1, 3],
    "Answer key taken from your question bank. Review this topic in your notes.");
  mc("prenatal", "A nurse is caring for a client who is at 18 weeks of gestation. The client tells the nurse that she felt fluttering movements in her abdomen 3 days ago. The nurse should interpret this finding as which of the following?",
    ["Ballottement", "Lightening", "Quickening", "Chloasma"], 2,
    "Clients describe quickening as a fluttering sensation, which can be felt as early as the 14th week of gestation. It reflects fetal movement.");
  mc("prenatal", "A nurse is caring for a client who is at 40 weeks gestation and is in active labor. The client has 6 cm of cervical dilation and 100% cervical effacement. The nurse obtains the client's blood pressure reading as 82/52 mm Hg. Which of the following nursing interventions should the nurse perform?",
    ["Prepare for a cesarean birth.", "Assist the client to an upright position.", "Prepare for an immediate vaginal delivery.", "Assist the client to turn onto her side."], 3,
    "Maternal hypotension results from the pressure of the enlarged uterus on the inferior vena cava. Turning the client to her right side relieves this pressure and restores blood pressure to the expected reference range.");
  mc("prenatal", "A nurse in a provider's office is caring for a client who is at 34 weeks of gestation and at risk for placental abruption. The nurse should recognize that which of the following is the most common risk factor for abruption?",
    ["Cocaine use", "Hypertension", "Blunt force trauma", "Cigarette smoking"], 1,
    "Maternal hypertension, either chronic or related to pregnancy, is the most common risk factor for placental abruption.");
  mc("prenatal", "A nurse in a prenatal clinic is caring for a client who is at 12 weeks gestation. The client asks about the cause of her heartburn. Which of the following responses should the nurse make?",
    ["Retained bile in the liver results in delayed digestion.", "Increased estrogen production causes increased secretion of hydrochloric acid.", "Pressure from the growing uterus displaces the stomach.", "Increased progesterone production causes decreased motility of smooth muscle."], 3,
    "Increased progesterone production causes a relaxation of the cardiac sphincter of the stomach and delayed gastric emptying, which can result in heartburn.");
  mc("prenatal", "A nurse in a prenatal clinic is reviewing the health record of a client who is at 28 weeks of gestation. The history includes one pregnancy, terminated by elective abortion at 9 weeks; the birth of twins at 36 weeks; and a spontaneous abortion at 15 weeks. According to the GTPAL system, which of the following describes the client's current status?",
    ["4-0-1-2-2", "3-0-2-0-2", "2-0-0-2-0", "4-2-0-2-2"], 0,
    "This response correctly describes the client's current status: pregnant currently and had 3 prior pregnancies (G); no term births (T); one pregnancy resulted in the preterm birth (P) of twins; two pregnancies ended in abortion (A); and she has two living children (L).");
  mc("prenatal", "A nurse is teaching about fetal development to a group of clients in the antenatal clinic. Which of the following statements should the nurse include in the teaching?",
    ["\"The baby's heart beat is audible by a Doppler stethoscope at 12 weeks of pregnancy.\"", "\"The sex of the baby is determined by week 8 of pregnancy.\"", "\"Very fine hairs, called lanugo, cover your baby's entire body by week 36 of pregnancy.\"", "\"You will first feel your baby move in week 24 of pregnancy.\""], 0,
    "The fetal heartbeat is audible by Doppler stethoscope between 8 to 17 weeks of gestation.");
  mc("prenatal", "A nurse in a prenatal clinic is caring for a client who asks what her estimated date of delivery will be if her last menstrual period was May 4, 2015. Which of the following is the appropriate response by the nurse?",
    ["February 11, 2016", "February 27, 2016", "April 27, 2016", "April 11, 2016"], 0,
    "Subtracting 3 calendar months and adding 7 days plus one year will result in this estimated date of delivery.");
  mc("prenatal", "A nurse is caring for a client who is in the first stage of labor and is using pattern-paced breathing. The client says she feels lightheaded and her fingers are tingling. Which of the following actions should the nurse take?",
    ["Administer oxygen via nasal cannula.", "Assist the client to breathe into a paper bag.", "Have the client tuck her chin to her chest.", "Instruct the client to increase her respiratory rate to more than 42 breaths per min."], 1,
    "This client is experiencing respiratory alkalosis due to hyperventilation. The client should be assisted to breathe into a paper bag or to cup her hands over her mouth to increase the carbon dioxide level, which replaces the bicarbonate ion.");
  mc("prenatal", "A nurse in the labor and delivery unit is caring for a client who is undergoing external fetal monitoring. The nurse observes that the fetal heart rate begins to slow after the start of a contraction and the lowest rate occurs after the peak of the contraction. Which of the following actions should the nurse take first?",
    ["Place the client in the lateral position.", "Increase the rate of maintenance IV infusion.", "Elevate the client's legs.", "Administer oxygen using a nonrebreather mask."], 0,
    "This is a late deceleration and is associated with fetal hypoxemia due to insufficient placental perfusion. Placing the client in the lateral position is the first action the nurse should take.");
  mc("prenatal", "A nurse is caring for a client who is in labor. Which of the following nursing actions reflects application of the gate control theory of pain?",
    ["Administer prescribed analgesic medication.", "Encourage the client to rest between contractions.", "Massage the client's back.", "Turn the client onto her left side."], 2,
    "The gate control theory of pain is based on the concept of blocking or preventing the transmission of pain signals to the brain by using distraction techniques such as massage. Massaging the client's back focuses on neuromuscular and cognitive changes.");
  mc("prenatal", "A nurse on the labor and delivery unit is caring for a client following a vaginal examination by the provider which is documented as: -1. Which of the following interpretations of this finding should the nurse make?",
    ["The presenting part is 1 cm above the ischial spines.", "The presenting part is 1 cm below the ischial spines.", "The cervix is 1 cm dilated.", "The cervix is effaced 1 cm."], 0,
    "Station is the relation of the presenting part to the ischial spines of the maternal pelvis and is measured in centimeters above, below, or at the level of the spines. If the station is minus (-) 1, then the presenting part is 1 cm above the ischial spines.");
  mc("prenatal", "A nurse on the labor and delivery unit is caring for a client who is having a difficult, prolonged labor with severe backache. Which of the following contributing causes should the nurse identify?",
    ["Fetal attitude is in general flexion.", "Fetal lie is longitudinal.", "Maternal pelvis is gynecoid.", "Fetal position is persistent occiput posterior."], 3,
    "The persistent occiput posterior position of the fetus is a common cause of prolonged, difficult labor with severe back pain as spinal nerves are being compressed. Counterpressure or a hands-and-knees position can offer pain relief.");
  mc("prenatal", "A nurse in is caring for a client who is to undergo an amniotomy. Which of the following is the priority nursing action following this procedure?",
    ["Observe color and consistency of fluid.", "Assess the fetal heart rate pattern.", "Assess the client's temperature.", "Evaluate client for the presence of chills and increased uterine tenderness using palpation."], 1,
    "Variable fetal heart rate decelerations and bradycardia can occur with an amniotomy as a result of umbilical cord prolapse or compression. Cord prolapse necessitates an emergent delivery.");
  mc("prenatal", "A nurse is admitting a client who has severe preeclampsia at 35 weeks of gestation and is reviewing the provider's orders. Which of the following orders requires clarification?",
    ["Assess deep tendon reflexes every hour.", "Obtain a daily weight.", "Continuous fetal monitoring", "Ambulate twice daily."], 3,
    "A provider's order to allow the client to ambulate requires clarification. The client who has severe preeclampsia should be placed on bedrest in a quiet, nonstimulating environment to prevent seizures and promote optimal placental blood flow.");
  mc("prenatal", "A nurse is admitting a client who is at 36 weeks gestation and has painless, bright red vaginal bleeding. The nurse should recognize this finding as an indication of which of the following conditions?",
    ["Abruptio placentae", "Placenta previa", "Precipitous labor", "Threatened abortion"], 1,
    "Painless, bright red vaginal bleeding in the second or third trimester is a manifestation of placenta previa.");
  mc("prenatal", "A nurse in a clinic is reviewing the medical records of a group of clients who are pregnant. The nurse should anticipate the provider will order a maternal serum alpha-fetoprotein (MSAFP) screening for which of the following clients?",
    ["A client who has mitral valve prolapse", "A client who has been exposed to AIDS", "All of the clients", "A client who has a history of preterm labor"], 2,
    "MSAFP is a screening tool to detect open spinal and abdominal wall defects in the fetus. This maternal blood test is recommended for all pregnant woman.");
  mc("prenatal", "A nurse is caring for a client during a nonstress test (NST). At the end of a 30-min period of observation, the nurse notes the following findings: The fetal heart rate baseline is 120/min with minimal variability and no accelerations. There are two decelerations of 15 /min in the fetal heart rate during a period of fetal movement, each lasting 20 seconds. Which of the following interpretations of these findings should the nurse make?",
    ["A negative test", "A nonreactive test", "A positive test", "A reactive test"], 1,
    "An NST that does not produce two or more qualifying accelerations within a 20-min period is interpreted as nonreactive. Qualifying accelerations peak at least 15 /min above the FHR baseline and last at least 15 seconds.");
  mc("prenatal", "A nurse in a provider's office is caring for a client who is at 36 weeks of gestation and scheduled for an amniocentesis. The client asks why she is having an ultrasound prior to the procedure. Which of the following is an appropriate response by the nurse?",
    ["\"This will determine if there is more than one fetus.\"", "\"It is useful for estimating fetal age.\"", "\"It assists in identifying the location of the placenta and fetus.\"", "\"This is a screening tool for spina bifida.\""], 2,
    "Identifying the positions of the fetus, placenta, and amniotic fluid pockets immediately prior to the amniocentesis increases the safety of this test by assisting with correct placement of the needle.");
  mc("prenatal", "A nurse in a prenatal clinic is teaching a group of clients about nutrition requirements during lactation. Which of the following statements should the nurse make?",
    ["\"Calcium intake should be at least 2,000 mg per day.\"", "\"Zinc intake should be at least 12 mg per day.\"", "\"The recommended intake of folic acid remains the same as for pregnant women.\"", "\"The recommended intake of iron increases.\""], 1,
    "Zinc intake should be increased to 12 mg per day during lactation, which is above the recommended levels for pregnancy and nonpregnant female clients over age 19.");
  mc("prenatal", "A nurse on the obstetric unit is caring for a client who experienced abruptio placentae. The nurse observes petechiae and bleeding around the IV access site. The nurse should recognize that this client is at risk for which of the following complications?",
    ["Anaphylactoid syndrome of pregnancy", "Disseminated intravascular coagulation", "Preeclampsia", "Puerperal infection"], 1,
    "Clinical manifestations of disseminated intravascular coagulation (DIC) include oozing from intravenous access and venipuncture sites; petechiae, especially under the site of the blood pressure cuff; spontaneous bleeding from the gums and nose; other signs of bruising; and hematuria.");
  mc("prenatal", "A nurse is caring for a client who is in active labor with 7 cm of cervical dilation and 100% effacement. The fetus is at 1+ station, and the client's amniotic membranes are intact. The client suddenly states that she needs to push. Which of the following actions should the nurse take?",
    ["Assist the client into a comfortable position.", "Observe the perineum for signs of crowning.", "Have the client pant during the next contractions.", "Help the client to the bathroom to void."], 2,
    "Panting is rapid, continuous, shallow breathing. It helps a client in labor refrain from pushing before her cervix reaches full dilation. Observe for hyperventilation and have the client exhale slowly through pursed lips.");
  mc("prenatal", "A nurse midwife is examining a client who is a primigravida at 42 weeks of gestation and states that she believes she is in labor. Which of the following findings confirm to the nurse that the client is in labor?",
    ["Cervical dilation", "Report of pain above the umbilicus", "Brownish vaginal discharge", "Amniotic fluid in the vaginal vault"], 0,
    "Cervical dilation and effacement are indications of true labor.");
  mc("prenatal", "A nurse in a prenatal clinic is caring for a client who is at 38 weeks of gestation and undergoing a contraction stress test. The test results are negative. Which of the following interpretations of this finding should the nurse make?",
    ["There is evidence of cervical incompetence.", "There is no evidence of two or more accelerations in fetal heart rate in 20 min.", "There is no evidence of uteroplacental insufficiency.", "There are less than 3 uterine contractions in a 10-min period."], 2,
    "A contraction stress test determines how well the fetus tolerates the stress of uterine contractions. A test is negative when there are at least 3 uterine contractions in a 10-min period with no late or significant variable decelerations during electronic fetal monitoring. Uteroplacental insufficiency produces late decelerations.");
  mc("prenatal", "A nurse is teaching a group of clients who are in their first trimester about exercise during pregnancy. Which of the following statements should the nurse include in the teaching?",
    ["\"Refrain from exercises that include stretching.\"", "\"Moderate exercise improves circulation.\"", "\"It is recommended to increase your weight-bearing exercises.\"", "\"It is recommended to rest for 30 minutes before each new exercise.\""], 1,
    "Improving circulation is just one of the many benefits of moderate exercise during pregnancy. It enhances well-being, promotes rest and relaxation, and improves muscle tone.");
  mc("prenatal", "A nurse in a prenatal clinic is teaching a client who is in her second trimester and has a new diagnosis of gestational diabetes. Which of the following statements by the client indicates a need for further teaching?",
    ["\"I should limit my carbohydrates to 50% of caloric intake.\"", "\"I will reduce my exercise schedule to 3 days a week.\"", "\"I will take my glyburide daily with breakfast.\"", "\"I know I am at increased risk to develop type 2 diabetes.\""], 1,
    "Increased exercise benefits the client and can result in improved management of gestational diabetes.");
  mc("prenatal", "A nurse in a prenatal clinic overhears a newly licensed nurse discussing conception with a client. Which of the following statements by the newly licensed nurse requires intervention by the nurse?",
    ["\"Fertilization takes place in the outer third of the fallopian tube.\"", "\"Implantation occurs between 2 and 3 weeks after conception.\"", "\"Sperm remain viable in the woman's reproductive tract for 2 to 3 days.\"", "\"Bleeding or spotting can accompany implantation.\""], 1,
    "This statement requires clarification because implantation occurs between 6 to 10 days following conception.");
  mc("prenatal", "A nurse in a prenatal clinic is caring for a client who is at 39 weeks of gestation and who asks about the signs that precede the onset of labor. Which of the following should the nurse identify as a sign that precedes labor?",
    ["Decreased vaginal discharge", "A surge of energy", "Urinary retention", "Weight gain of 0.5 to 1.5 kg"], 1,
    "Prior to the onset of labor, the pregnant client experiences a surge of energy.");
  mc("prenatal", "A nurse receives report about assigned clients at the start of the shift. Which of the following clients should the nurse plan to see first?",
    ["A client who experienced a cesarean birth 4 hr ago and reports pain", "A client who has preeclampsia with a BP of 138/90 mm Hg", "A client who experienced a vaginal birth 24 hr ago and reports no bleeding", "A client who is scheduled for discharge following a laparoscopic tubal ligation"], 0,
    "Using Maslow's hierarchy of needs, assessment of pain and meeting the physiological needs of a surgical client are the priority nursing actions.");
  mc("prenatal", "A nurse is assessing a client in labor who has had epidural anesthesia for pain relief. Which of the following findings should the nurse identify as a complication from the epidural block?",
    ["Vomiting", "Tachycardia", "Respiratory depression", "Hypotension"], 3,
    "Maternal hypotension is an adverse effect of epidural anesthesia. The nurse should administer an IV fluid bolus prior to the placement of the epidural catheter to decrease the likelihood of this complication.");
  mc("prenatal", "A nurse is caring for a client who is gravida 3, para 2, and is in active labor. The fetal head is at 3+ station after a vaginal examination. Which of the following actions should the nurse take?",
    ["Apply fundal pressure.", "Observe for the presence of a nuchal cord.", "Observe for crowning.", "Prepare to administer oxytocin."], 2,
    "In the descent phase of the second stage of labor, crowning occurs when the fetal head is at +2 to +4 station. Because this is the client's third childbirth experience, it is reasonable to assume that delivery is imminent.");
  mc("prenatal", "A nurse in a prenatal clinic is instructing a client about an amniocentesis, which is scheduled at 15 weeks of gestation. Which of the following should be included in the teaching?",
    ["\"The test will be performed if your baby's heart beat is heard.\"", "\"This test will determine if your baby's lungs are mature.\"", "\"This test requires the presence of amniotic fluid.\"", "\"After the test, you will be given Rho immune globulin since you are Rh positive.\""], 2,
    "Amniocentesis requires adequate amniotic fluid for testing, which is not available until after 14 weeks of gestation.");
  sata("prenatal", "A nurse is teaching a client who is at 15 weeks of gestation and is to undergo an amniocentesis. The nurse should explain that the purpose of this test is to identify which of the following conditions? (Select all that apply.)",
    ["Rh incompatibility", "Cephalopelvic disproportion", "Anomalies in fetal chromosomes", "Neural tube defects", "Fetal gender"], [2, 3, 4],
    "<b>Rh incompatibility is incorrect.</b> An indirect Coombs test is a screening tool for Rh incompatibility.<br><br><b>Cephalopelvic disproportion is incorrect.</b> Abdominal ultrasonography is used to identify cephalopelvic disproportion later in pregnancy.<br><br><b>Anomalies in fetal chromosomes is correct.</b> Examination of amniotic fluid yields data about genetic anomalies, such as hemophilia and inborn metabolic disorders.<Br><br><b>Neural tube defects is correct.</b> Examination of alpha fetoprotein levels in amniotic fluid confirms the presence of a neural tube defect, such as spina bifida.<Br><br><b>Fetal gender is correct.</b> Karyotyping of fetal cells obtained from amniotic fluid permits the identification of fetal gender, which is important if an X-linked disorder is suspected in a male fetus.");
  mc("prenatal", "A nurse is admitting a client who is at 33 weeks of gestation and has a diagnosis of placenta previa. Which of the following is the priority nursing action?",
    ["Monitor vaginal bleeding.", "Administer glucocorticoids.", "Insert an IV catheter.", "Apply an external fetal monitor."], 3,
    "Based on Maslow's hierarchy of needs, the nurse should immediately apply the fetal monitor to determine if the fetus is in distress.");
  mc("prenatal", "A nurse is caring for a client who is in labor and has an epidural anesthesia block. The client's blood pressure is 80/40 mm Hg and the fetal heart rate is 140/min. Which of the following is the priority nursing action?",
    ["Elevate the client's legs.", "Monitor vital signs every 5 min.", "Notify the provider.", "Place the client in a lateral position"], 3,
    "Based on Maslow's hierarchy of needs, the client should be moved to a lateral position or a pillow placed under one of the client's hips to relieve pressure on the inferior vena cava and improve the blood pressure.");
  mc("prenatal", "A nurse is providing teaching to a client who is pregnant and has phenylketonuria (PKU). Which of the following foods should the nurse instruct the client to eliminate from her diet?",
    ["Peanut butter", "Potatoes", "Apple juice", "Broccoli"], 0,
    "The nurse should instruct the client to eliminate protein-rich foods that contain phenylalanine from the diet. These include meats, eggs, milk, nuts, and wheat products.");
  mc("prenatal", "A nurse is teaching a client who is at 23 weeks of gestation and will return to the facility in 2 days for an amniocentesis. Which of the following instructions should the nurse give the client?",
    ["Food and fluids should not be consumed the day of the procedure.", "Complete a bowel prep protocol the day before the procedure.", "Empty her bladder immediately prior to the procedure.", "Wash her abdomen with soap and water the morning of the procedure."], 2,
    "Emptying the bladder before amniocentesis prevents possible puncture of the bladder and displacement of the uterus and fetus.");
  mc("prenatal", "A nurse is caring for a client who is in labor and assists the provider who performs an amniotomy. Which of the following is the priority action by the nurse following the procedure?",
    ["Monitor the client's temperature.", "Assess the fetal heart rate.", "Assess the odor of the amniotic fluid.", "Provide clean, dry underpads."], 1,
    "The fetal heart rate should be assessed before and immediately after the amniotomy to detect any changes.");
  mc("prenatal", "A nurse is instructing a male client about a semen analysis to be done for suspected infertility. Which of the following should be included in the teaching?",
    ["Abstain from ejaculation for at least 2 to 5 days prior to the test.", "Refrigerate the specimen after collection.", "Leave the specimen at room temperature for 3 to 4 hr prior to transport to the laboratory.", "Collect the specimen using a condom with spermicidal lubricant."], 0,
    "The client should be instructed to abstain from ejaculation for at least 2 to 5 days prior to the test.");
  mc("prenatal", "A nurse is caring for a client who is in active labor and notes late decelerations on the fetal monitor. Which of the following is the priority nursing action?",
    ["Elevate the client's legs.", "Position the client on her side.", "Administer oxygen via face mask.", "Increase the infusion rate of the IV fluid."], 1,
    "Late decelerations stem from decreased blood perfusion to the placenta or compression of the placenta. A position change should increase perfusion or decrease compression, and it is the first intervention the nurse should try. The greatest risk to the client is fetal hypoxia, so the priority action is the one that has the best chance of improving fetal perfusion.");
  mc("prenatal", "A nurse is assessing a client who is pregnant for preeclampsia. Which of the following findings should indicate to the nurse that the client requires further evaluation for this disorder?",
    ["Increased urine output", "Vaginal discharge", "Elevated blood pressure", "Joint pain"], 2,
    "Hypertension is one of the cardinal symptoms of preeclampsia, along with excessive weight gain, edema, and albumin in the urine.");
  mc("prenatal", "A nurse in the emergency department is caring for a client who comes to the emergency department reporting severe abdominal pain in the left lower quadrant. The provider suspects a ruptured ectopic pregnancy. Which of the following signs indicates to the nurse that the client has blood in the peritoneum?",
    ["Chvostek's sign", "Cullen's sign", "Chadwick's sign", "Goodell's sign"], 1,
    "Cullen's sign is a blue discoloration similar to ecchymosis around the umbilicus. It indicates hematoperitoneum, a common clinical manifestation of a ruptured ectopic pregnancy.");
  mc("prenatal", "A nurse is admitting a client who is at 38 weeks of gestation and is in the first stage of labor. Which of the following assessment findings should the nurse report to the provider first?",
    ["Expulsion of a blood-tinged mucous plug", "Continuous contraction lasting 2 min", "Pressure on the perineum causing the client to bear down", "Expulsion of clear fluid from the vagina"], 1,
    "A uterus contracting for more than 90 seconds is a sign of tetany and could lead to uterine rupture, which is the greatest risk to the client at this time. The nurse should report this finding immediately.");
  mc("prenatal", "A nurse admits a woman who is at 38 weeks of gestation and in early labor with ruptured membranes. The nurse determines that the client's oral temperature is 38.9¡ C (102¡ F). Besides notifying the provider, which of the following is an appropriate nursing action?",
    ["Recheck the client's temperature in 4 hr.", "Administer glucocorticoids intramuscularly.", "Assess the odor of the amniotic fluid.", "Prepare the client for emergency cesarean section."], 2,
    "Chorioamnionitis is an infection of the amniotic cavity that presents with maternal fever, tachycardia, increased uterine tenderness, and foul-smelling amniotic fluid.");
  mc("prenatal", "A nurse in the antepartum unit is caring for a client who is at 36 weeks of gestation and has pregnancy-induced hypertension. Suddenly, the client reports continuous abdominal pain and vaginal bleeding. The nurse should suspect which of the following complications?",
    ["Placenta previa", "Prolapsed cord", "Incompetent cervix", "Abruptio placentae"], 3,
    "The classic signs of abruptio placentae include vaginal bleeding, abdominal pain, uterine tenderness, and contractions.");
  mc("prenatal", "A nurse is caring for a client who was admitted to the maternity unit at 38 weeks of gestation and who is experiencing polyhydramnios. The nurse should understand that this diagnosis means which of the following?",
    ["The client is carrying more than one fetus.", "There is an elevated level of alpha-fetoprotein (AFP) in the amniotic fluid.", "An excessive amount of amniotic fluid is present.", "The fetus is likely to have a congenital anomaly, be growth restricted, or demonstrate fetal distress during labor."], 2,
    "An excess of amniotic fluid is defined as amniotic fluid pockets of >8 cm or an amniotic fluid index of greater than 25. Polyhydramnios or hydramnios is associated with neural tube defects, obstructions of the fetal gastrointestinal tract, multiple fetuses, and fetal hydrops.");
  mc("prenatal", "A nurse is caring for a client who is in the active phase of the first stage of labor. When monitoring the uterine contractions, which of the following findings should the nurse report to the provider?",
    ["Contractions lasting longer than 90 seconds", "Contractions occurring every 3 to 5 min", "Contractions are strong in intensity", "Client reports feeling contractions in lower back"], 0,
    "A pattern of prolonged uterine contractions lasting more than 90 seconds is an indication that there is inadequate uterine relaxation and should be reported to the provider.");
  mc("prenatal", "A nurse in a clinic is caring for a client who is at 11 weeks of gestation and reports that she has had slight occasional vaginal bleeding over the past 2 weeks. Following an examination by the provider, the client is told that the fetus has died and that the placenta, fetus, and tissues remain in the uterus. How should the nurse document these findings?",
    ["Incomplete miscarriage", "Missed miscarriage", "Inevitable miscarriage", "Complete miscarriage"], 1,
    "With a missed miscarriage, the fetus has died but the client retains the products of conception for several weeks. The client might have spotting or no bleeding at all.");
  mc("prenatal", "A nurse is caring for a client who is at 37 weeks of gestation and has placenta previa. The client asks the nurse why the provider does not do an internal examination. Which of the following explanations of the primary reason should the nurse provide?",
    ["\"There is an increased risk of introducing infection.\"", "\"This could initiate preterm labor.\"", "\"This could result in profound bleeding.\"", "\"There is an increased risk of rupture of the membranes.\""], 2,
    "\"Pelvic rest\" is essential for clients who have placenta previa because any disruption of placental blood vessels in the lower uterine segment could cause premature separation of the placenta and life-threatening hemorrhage. This means no vaginal examinations, no douching, and no vaginal intercourse.");
  mc("prenatal", "A nurse is completing the admission assessment of a client who is at 38 weeks of gestation and has severe preeclampsia. Which of the following is an expected finding?",
    ["Tachycardia", "Absence of clonus", "Polyuria", "Report of headache"], 3,
    "Manifestations of severe preeclampsia include severe (usually frontal) headache, blurred vision, photophobia, scotomas, right upper quadrant pain, irritability, presence of clonus and brisk deep tendon reflexes, nausea, vomiting, hypertension, oliguria, and proteinuria.");
  mc("prenatal", "A nurse is planning care for a client who is at 10 weeks of gestation and reports abdominal pain and moderate vaginal bleeding. The tentative diagnosis is inevitable abortion. Which of the following nursing interventions should be included in the plan of care?",
    ["Administer oxygen via nasal cannula.", "Offer option to view products of conception.", "Instruct the client to increase potassium-rich foods in the diet.", "Maintain the client on bed rest."], 1,
    "Providing support for pregnancy loss includes offering the client and her partner the options of viewing the products of conception and making arrangements for handling of the fetal remains. The client should be instructed on possible grief responses, how to manage these, and provided a referral to a support group.");
  mc("prenatal", "A nurse is creating the plan of care for a client who is at 39 weeks of gestation and in active labor. Which of the following actions should the nurse include in the plan of care?",
    ["Keep four side rails up while the client is in bed.", "Check the cervix prior to analgesic administration", "Monitor the fetal heart rate (FHR) every hour.", "Insert an indwelling urinary catheter."], 1,
    "Prior to administering an analgesic during active labor, the nurse must know how many centimeters the cervix has dilated. Administration too close to the time of delivery could cause respiratory depression in the newborn.");
  mc("prenatal", "A nurse is performing Leopold maneuvers on a client who is in labor and determines the fetus is in an RSA position. Which of the following fetal presentations should the nurse document in the client's medical record?",
    ["Vertex", "Shoulder", "Breech", "Mentum"], 2,
    "An RSA position indicates that the body part of the fetus that is closest to the cervix is the sacrum. Therefore, the buttocks or feet are the presenting part, which is classified as a breech presentation.");
  mc("prenatal", "A nurse is providing education to a client during the first prenatal visit. Which of the following statements by the client should indicate to the nurse a need for clarification?",
    ["\"I should drink about 2 liters of fluid each day.\"", "\"I should not drink alcoholic beverages during my pregnancy.\"", "\"I can have a moderate amount of caffeine daily.\"", "\"I should increase my calcium intake to 1,500 milligrams per day\""], 3,
    "A woman's dietary reference intake (DRI) of calcium for pregnancy and lactation is the same for a woman who is not pregnant. The DRI for a woman older than 19 years of age is 1,000 mg/day, which should supply enough calcium for fetal bone and tooth development and to maintain maternal bone mass.");
  mc("prenatal", "A nurse is caring for a client following an amniotomy who is now in the active phase of the first stage of labor. Which of the following actions should the nurse implement with this client?",
    ["Maintain the client in the lithotomy position.", "Perform vaginal examinations frequently.", "Remind the client to bear down with each contraction.", "Encourage the client to empty her bladder every 2 hr."], 3,
    "A client in labor should be encouraged to empty her bladder every 2 hr. Bladder distention can impede the descent of the fetus and slow the progression of labor. It can also contribute to uterine atony after delivery, increasing the client's risk of postpartum hemorrhage.");
  sata("prenatal", "A nurse is caring for a client who had a vaginal delivery 2 hr ago. Which of the following actions should the nurse anticipate in the care of this client? (Select all that apply.)",
    ["Document fundal height.", "Massage a firm fundus.", "Observe the lochia during palpation of fundus.", "Determine whether the fundus is midline.", "Administer methylergonovine maleate if uterus is boggy."], [0, 2, 3, 4],
    "<b>Document fundal height is correct.</b>Fundal height should be documented each time it is assessed. The return of the uterus to a nonpregnant state following birth is called involution, which begins immediately after birth. At the end of the third stage of labor, the uterus should be midline approximately 2 cm below the level of the umbilicus. Within 12 hr postpartum, the fundus might rise to approximately 1 cm above the umbilicus. The nurse must monitor and palpate the fundus for location and tone to detect the risk of postpartum hemorrhage.<br><br><b>Massage a firm fundus is incorrect.</b> If the uterus is boggy, the nurse should massage the uterus to stimulate uterine contractions. A firm fundus does not require massage. A boggy uterus is the most common cause of postpartum hemorrhage.<br><br><b> Observe the lochia during palpation of fundus is correct.</b> During palpation of the fundus, the nurse should expect and observe an increase in lochia. The appearance of lochia changes as the client progresses in the postpartum period. Lochia is initially red (rubra: 1 to 3 days); pink/brown (serosa: 4 to 10 days); and yellow/white (alba: 11 days to 6 weeks). The color and amount of lochia indicates sloughing of the lining of the uterus. An increase in the amount of lochia and the presence of large clots might indicate postpartum hemorrhage.<br><br><b> Determine whether the fundus is midline is correct.</b> The nurse must monitor and palpate the fundus for location and tone. The fundus should be firm and midline. A full bladder can cause the uterus to be displaced to one side.<Br><br><b>Administer methylergonovine maleate if uterus is boggy is correct.</b> The nurse should assist the client with urination immediately followed by uterine massage to stimulate uterine contraction. If the uterus is boggy, the nurse should massage the uterus to stimulate the uterus to contract. Methylergonovine maleate is an ergot alkaloid used to promote uterine contractions and prevent hemorrhage. The nurse should monitor hypertension with the administration of this medication because of smooth muscle vasoconstriction. This medication can be prescribed as scheduled or PRN to meet the needs of the client. This medication is given intramuscularly (IM).");
  mc("prenatal", "A nurse is providing teaching about expected gestational changes to a client who is at 12 weeks of gestation. Which of the following statements by the client indicates a need for further teaching?",
    ["\"I will reduce my stress level.\"", "\"I will tell my doctor before using home remedies for nausea.\"", "\"I will monitor my weight gain during the remaining months.\"", "\"I will use only nonprescription medications while pregnant.\""], 3,
    "Both nonprescription and prescription medications can be harmful to the fetus. The client needs to understand the importance of disclosing all medications, supplements, and vitamins to the provider prior to use during pregnancy.");
  mc("prenatal", "A charge nurse observes a nurse checking fetal heart tones (FHT) for a client who is at 12 weeks of gestation. Which of the following actions by the nurse indicates a need for intervention by the charge nurse?",
    ["Places a pillow under the client's head", "Counts the fetal heart rate for a full minute", "Auscultates above the symphysis pubis", "Listens with a fetoscope"], 3,
    "A fetoscope is not able to detect FHT this early in the pregnancy. The nurse should use a Doppler or ultrasound stethoscope. Typically at 12 weeks, the heart tones will be heard midline just above the symphysis pubis with a Doppler or ultrasound device. A fetoscope can be used to assess FHT later in the pregnancy, around 16 to 20 weeks.");
  mc("prenatal", "A nurse is caring for a client who is in active labor when the client's membranes rupture. The fetal monitor tracing shows late decelerations. Which of the following actions should the nurse take first?",
    ["Palpate the client's uterus.", "Administer oxygen to the client.", "Increase the client's IV fluid infusion rate.", "Turn the client onto her side."], 3,
    "When using the urgent vs non-urgent approach to client care, the nurse determines that the priority action is to turn the client onto her left side. Late decelerations indicate that the client might have uteroplacental insufficiency, maternal hypotension, uterine tachysystole form oxytocin administration, or several other complicating factors. The client might be exerting pressure on the inferior vena cava, which decreases the oxygen to the placenta and thus to the fetus. Turning the client onto her side will relieve the pressure and facilitate better blood flow to the placenta, thereby increasing the fetal oxygen supply.");
  mc("prenatal", "A nurse is preparing a client who is in active labor for epidural analgesia. Which of the following actions should the nurse take?",
    ["Have the client stand at the bedside with her arms at her side.", "Administer a 500 mL bolus of 5% dextrose in water prior to induction.", "Inform the client the anesthetic effect will last for approximately 6 hr.", "Obtain a 30 min electronic fetal monitoring (EFM) strip prior to induction."], 3,
    "The nurse should obtain a 20 to 30 min EFM strip before induction of the spinal anesthesia. The strip should be evaluated as baseline information. After induction, fetal heart rate and pattern is assessed and documented every 5 to 10 min and emergency care is provided for fetal distress, such as bradycardia or late decelerations.");
  mc("prenatal", "A nurse is caring for a client who is receiving opioid epidural analgesia during labor. Which of the following findings is the nurse's priority?",
    ["The client reports weakness of the lower extremities.", "Blood pressure 80/56 mm Hg", "Temperature 38.2&degC (100.8&degF)", "The client reports perfuse itching."], 1,
    "When using the airway, breathing, circulation approach to client care, the nurse's priority finding is a blood pressure of 80/56, which indicates hypotension. The client's blood pressure is not adequate to sustain uteroplacental perfusion and oxygen to the fetus, which can lead to respiratory distress and possibly death.");
  mc("prenatal", "A nurse is providing teaching to a client who is at 30 weeks of gestation and is to have a nonstress test (NST). Which of the following statements by the client indicates a need for further teaching?",
    ["\"I will have to lie on my back during the test.\"", "\"My baby's heart rate will be monitored during the test.\"", "\"I should schedule the test when the baby is usually active.\"", "\"It will take 20 to 30 minutes to complete the test.\""], 0,
    "The client is placed in a Semi-Fowler's position with one hip slightly elevated to promote uterine perfusion and prevent supine hypotension as a result of the uterus compressing the maternal vena cava.");
  mc("prenatal", "A nurse is caring for a client who gave birth 2 hr ago. The nurse notes that the client's blood pressure is 60/50 mm Hg. Which of the following actions should the nurse take first?",
    ["Evaluate the firmness of the uterus.", "Initiate oxygen therapy by nonrebreather mask.", "Administer oxytocin infusion.", "Obtain a type and crossmatch."], 0,
    "The first action the nurse should take using the nursing process is to assess the client. A blood pressure of 60/50 mm Hg can indicate postpartum hemorrhage; therefore, the first action the nurse should take is to evaluate the firmness of the uterus to determine if there is uterine atony.");
  sata("prenatal", "A nurse is admitting a client who is at 37 weeks of gestation and has severe gestational hypertension. Which of the following actions should the nurse expect to implement? (Select all that apply.)",
    ["Administer magnesium sulfate IV.", "Provide a dark, quiet environment.", "Assess respiratory status every 4 hr.", "Evaluate neurologic status every 8 hr.", "Ensure that calcium gluconate is readily available."], [0, 1, 4],
    "<b>Administer magnesium sulfate IV is correct.</b> Magnesium sulfate IV is given as a tocolytic medication for preterm labor to relax smooth muscle of the uterus and as a treatment for preeclampsia. The underlying pathophysiology of preeclampsia is vasospasm. The nurse should closely monitor the client for signs of magnesium toxicity, such as loss of patellar reflexes, respiratory depression, cardiac arrhythmias, cardiac arrest, urinary retention, and serum magnesium levels higher than 8 mEq/L.<br><br><b>Provide a dark, quiet environment is correct.</b> A dark, quiet environment helps to decrease CNS stimulation, which minimizes the risk of seizures.<br><br><b>Assess respiratory status every 4 hr is incorrect.</b> The nurse should monitor the client's respiratory status closely because the client is at risk for respiratory depression. During an infusion of magnesium sulfate, the nurse should monitor the respiratory rate every 5 min and every 15 min during maintenance infusion. Depending on the client's response to the medication, the provider will prescribe for the vital signs to be monitored every 30 to 60 min thereafter.<br><br><b>Evaluate neurologic status every 8 hr is incorrect.</b> The nurse should evaluate the client's level of consciousness every hour.<br><br><b>Ensure that calcium gluconate is readily available is correct.</b> Calcium gluconate is the antidote for magnesium sulfate and should be readily available when administering magnesium sulfate. The nurse should be prepared to administer the medication in response to manifestations of magnesium toxicity, such as depressed respirations, oliguria, sudden drop in BP, loss of deep-tendon reflexes, and fetal distress.");
  mc("prenatal", "A nurse is caring for a client who is in active labor and notes late decelerations in the FHR. Which of the following actions should the nurse take first?",

  mc("prenatal", "A nurse in an antepartum unit is triaging clients. Which of the following clients should the nurse see first?",

  mc("prenatal", "A nurse is teaching a client who is at 23 weeks of gestation about immunizations. Which of the following statements should the nurse include in the teaching?",

  mc("prenatal", "A nurse is caring for a group of clients on an intrapartum unit. Which of the following findings should be reported to the provider immediately?",

    "These findings indicate that the client's condition is worsening and are signs of severe preeclampsia. They should be reported to the provider immediately. Other manifestations of severe preeclampsia include: blood pressure of 160/100 mm Hg or greater, proteinuria 3+ to 4+, oliguria, visual disturbances, such as blurred vision, hyperreflexia with clonus, nausea, vomiting, epigastric pain, and right upper-quadrant pain.");
  mc("prenatal", "A nurse is caring for a client who presents to a labor and delivery unit experiencing rapidly progressing labor. Which of the following is the priority action for the nurse to take?",
    ["Cut the umbilical cord.", "Apply perineal pressure to the emerging fetal head.", "Prevent the perineum from tearing.", "Promote delivery of the placenta."], 1,
    "Using Maslow's hierarchy of needs, the priority intervention is to prevent injury to the fetus during the delivery by applying gentle perineal pressure to the emerging head. This avoids rapid expulsion of the fetal head. A change in pressure within the fetal skull due to a rapid delivery can cause neurologic damage (increased intracranial pressure and dural/subdural tearing). Rapid birth can also cause maternal injury, such as vaginal or perineal lacerations.");

  mc("prenatal", "A primigravida calls the Labor & Delivery unit and tells the nurse that she is 39 weeks pregnant and that over the past few day, although her breathing has become easier, she now feels the urge to urinate more often and has more swelling in her ankles and feet. The nurse tells the client she is experiencing:",
    ["Quickening", "Lightening", "Goodell’s sign", "Hegar’s sign"], 1,

  /* ---------- MEDICATION MATH AND CALCULATIONS ---------- */
  fill("math", "Methylergonovine (Methergine) 0.2 mg PO q6h for 24 hours is ordered to help control postpartum bleeding. What is the total amount in mg the client receives in 24 hours? Enter the number only.", ["0.8", "0.80", "0.8 mg", "0.80 mg"], "Every 6 hours is 4 doses a day: 4 x 0.2 mg = 0.8 mg.");
