  mc("postpartum", "A nurse is caring for a client who is 1 hr postpartum and observes a large amount of lochia rubra and several small clots on the client's perineal pad. The fundus is midline and firm at the umbilicus. Which of the following actions should the nurse take?",
    ["Document the findings and continue to monitor the client.", "Notify the client's provider.", "Increase the frequency of fundal massage.", "Encourage the client to empty her bladder."], 0,
    "These are expected findings. At 1 hr postpartum, lochia rubra should be intermittent and associated with uterine contractions. The volume of lochia resembles that of a heavy menstrual period. Small clots are common. The nurse should document the findings and continue to monitor the client.");
  mc("postpartum", "A nurse is completing a home visit to a mother who is 3 days postpartum and breastfeeding her newborn. The mother expresses concern about the amount of weight the newborn has lost since birth. Which of the following is a response the nurse should make?",
    ["\"You might want to offer water supplements between feedings.\"", "\"It is due to the newborn's loss of the influence of the maternal hormones.\"", "\"This might be related to your baby having 3 stools a day.\"", "\"The cause might be too short or infrequent feedings.\""], 3,
    "Breastfed newborns typically lose 5% to 6% of body weight before gaining weight. Slow weight gain might be due to inadequate breastfeeding, incorrect feeding techniques, or maternal factors such as breasts not emptying, stress, and fatigue.");
  mc("postpartum", "A nurse is caring for a client who is postpartum. The nurse should recognize which of the following statements by the client as an indication of inhibition of parental attachment?",
    ["\"He's got my husband's nose, that's for sure.\"", "\"I don't need a baby bath demonstration. I know how to do it.\"", "\"I wish he had more hair. I will keep a hat on his head until he grows some.\"", "\"Do you think you could keep him in the nursery for the next feeding so I can get some sleep?\""], 2,
    "This client statement expresses disappointment in the newborn's appearance and a need to hide what the client perceives as an undesirable feature. This is an indication of inhibited parental attachment.");
  mc("postpartum", "A nurse is assessing a client who is 3 days postpartum and is breastfeeding. The nurse notes that the fundus is three fingerbreadths below the umbilicus, lochia rubra is moderate, and the breasts are hard and warm to palpation. Which of the following interpretations of these findings should the nurse make?",
    ["The client is exhibiting early indications of mastitis.", "Additional interventions are not indicated at this time.", "Application of a heating pad to the breasts is indicated.", "The client should be advised to remove her nursing bra."], 1,
    "For this postpartum day, the client's fundal location and lochia characteristics are within the expected reference range. Breast engorgement is typical, as this is the time when the breasts begin producing milk. Frequent breastfeeding and routine care can help relieve engorgement.");
  sata("postpartum", "A nurse is caring for a client who is 2 days postpartum, is breastfeeding, and reports nipple soreness. Which of the following measures should the nurse suggest to reduce discomfort during breastfeeding? (Select all that apply.)",
    ["Apply breast milk to the nipples before each feeding.", "Place breast pads inside the nursing bra.", "Massage the breasts and nipples prior to feeding.", "Start breastfeeding with the nipple that is less sore.", "Change the infant's position on the nipples."], [0, 3, 4],
    "<b>Apply breast milk to the nipples before each feeding is correct.</b>The application of colostrum and breast milk to the nipples moistens them and prepares them for breastfeeding. This can prevent and reduce nipple tenderness.<br><br><b>Place breast pads inside the nursing bra is incorrect. </b> Sore nipples should be exposed to the air as much as possible. The use of breast shells or cups inside the nursing bra is another option to reduce discomfort.<br><br><b>Massage the breasts and nipples prior to feeding is incorrect.</b> Massage can irritate nipple tissue. Massage is effective in promoting emptying of the engorged breast.<Br><br><b>Start breastfeeding with the nipple that is less sore is correct.</b> The client who is breastfeeding should start with the nipple that is less sore, as the newborns initial sucking motions are the strongest.<br><br><b>Change the infants position on the nipples is correct.</b> Changing the newborns position on the nipples reduces discomfort and prevents nipple soreness. Repositioning of the mother can also prevent nipple discomfort.");
  mc("postpartum", "A nurse is caring for a client who experienced a vaginal delivery 12 hr ago. When palpating the client's abdomen, at which of the following positions should the nurse expect to find the uterine fundus?",
    ["At the level of the umbilicus", "2 cm above the umbilicus", "One fingerbreadth above the symphysis pubis", "To the right of the umbilicus"], 0,
    "Within 12 hr, the fundus should be palpable at the level of the umbilicus and then recede 1 to 2 cm each day.");
  mc("postpartum", "A nurse is caring for a client who is postpartum. The client tells the nurse that the newborn's maternal grandmother was born deaf and asks how to tell if her newborn hears well. Which of the following statements should the nurse make?",
    ["\"There is no need to worry about that. Most forms of hearing loss are not inherited.\"", "\"Look at how she looks as you when you speak. That's a good sign.\"", "\"We do routine hearing screenings on newborns. You'll know the results before you leave the hospital.\"", "\"The best way to determine if your baby can hear is to clap your hands loudly and see if she startles.\""], 2,
    "Most states mandate hearing screening for all newborns. The two tests in use do not diagnose hearing loss, but determine whether or not a newborn requires further evaluation.");
  mc("postpartum", "A nurse is caring for a client who is postpartum who asks the nurse when her breast milk will \"come in.\" Which of the following responses should the nurse make?",
    ["Within 2 days", "In 3 to 5 days", "In 6 to 8 days", "In about 10 days"], 1,
    "By day 3 to 5, most clients who are breastfeeding begin to produce copious amounts of breast milk.");
  mc("postpartum", "A nurse is assessing a client who is 8 hr postpartum and multiparous. Which of the following findings should alert the nurse to the client's need to urinate?",
    ["Moderate lochia rubra", "Fundus three fingerbreadths above the umbilicus", "Moderate swelling of the labia", "Blood pressure 130/84 mm Hg"], 1,
    "A full bladder can raise the level of uterine fundus and possibly deviate it to the side.");
  mc("postpartum", "A nurse is preparing to measure the fundal height of a client who is at 22 weeks of gestation. At which location should the nurse expect to palpate the fundus?",
    ["3 cm above the umbilicus", "Slightly above the umbilicus", "Slightly below the umbilicus", "3 cm below the umbilicus"], 1,
    "At 22 weeks of gestation, the fundal height should be just above the level of the umbilicus. The distance in centimeters from the symphysis pubis to the top of the fundus is a gross estimate of the weeks of gestation.");
  mc("postpartum", "A nurse in a prenatal clinic is caring for a client. Using Leopold maneuvers, the nurse palpates a round, firm, moveable part in the fundus of the uterus and a long, smooth surface on the client's right side. In which abdominal quadrant should the nurse expect to auscultate fetal heart tones?",
    ["Left lower", "Right lower", "Left upper", "Right upper"], 3,
    "Fetal heart tones are best auscultated directly over the location of the fetal back, which, in this breech presentation, would be in the right upper quadrant.");
  mc("postpartum", "A nurse is caring for a client who is scheduled for a cesarean birth based upon the fetal lungs having reached maturity. Which of the following findings indicates that the fetal lungs are mature?",
    ["Phosphatidylglycerol (PG) absent", "Biophysical profile score of 8", "Lecithin/sphingomyelin (L/S) ratio of 2:1", "Nonstress test is reactive"], 2,
    "An L/S ratio of 2:1 is an indication of fetal lung maturity.");
  mc("postpartum", "A nurse is caring for a client who is 6 hr postpartum. The client is Rh-negative and her newborn is Rh-positive. The client asks why an indirect Coombs test was ordered by the provider. Which of the following is an appropriate response by the nurse?",
    ["\"It determines if kernicterus will occur in the newborn.\"", "\"It detects Rh-negative antibodies in the newborn's blood.\"", "\"It detects Rh-positive antibodies in the mother's blood.\"", "\"It determines the presence of maternal antibodies in the newborn's blood.\""], 2,
    "An indirect Coombs test determines the presence of Rh antibodies. If the client has Rh-negative blood, she does not produce Rh factor. Exposure to Rh positive blood, such as from an Rh factor positive fetus, could trigger the client to begin producing antibodies against Rh factor. These antibodies can cross the placenta and harm an Rh-positive fetus.");
  mc("postpartum", "A nurse is caring for a client who is 12 hr postpartum following a vaginal delivery. Which of the following findings should the nurse expect?",
    ["Fundus soft, 1 cm to the right of the umbilicus", "Fundus firm, at the level of the umbilicus", "Fundus present, to the left of the umbilicus", "Fundus soft, 2 cm above the umbilicus"], 1,
    "Within 12 hours after birth, the fundal tone is expected to be firm and the location is typically palpated midline and at the level of the umbilicus.");
  mc("postpartum", "A nurse is caring for a client who is postpartum and finds the fundus slightly boggy and displaced to the right. Based on these findings, which of the following actions should the nurse take?",
    ["Encourage the client to perform Kegel exercises.", "Encourage the client to move to the left lateral position.", "Ask the client to rate her pain.", "Assist the client to the bathroom to void."], 3,
    "A full bladder causes the uterus to be displaced above the umbilicus and off to one side. This prevents the uterus from contracting normally and increases the risk of hemorrhage.");
  mc("postpartum", "A nurse is caring for a client who is 5 hr postpartum following a vaginal birth of a newborn weighing 9 lb 6 oz. (4252 g). The nurse should recognize that this client is at risk for which of the following postpartum complications?",
    ["Puerperal infection", "Retained placental fragments", "Thrombophlebitis", "Uterine atony"], 3,
    "A uterus that is over distended, such as from a macrosomic fetus, has an increased risk of uterine atony.");
  mc("postpartum", "A nurse is caring for a client who is 4 hr postpartum following a vaginal birth. The client has saturated a perineal pad within 10 min. Which of the following actions should the nurse take first?",
    ["Assess client's blood pressure.", "Assess the bladder for distention.", "Massage the client's fundus.", "Prepare to administer a prescribed oxytocic preparation."], 2,
    "The initial management of excessive uterine bleeding is firm massage of the uterine fundus. This action stimulates contraction of the uterine muscles, which constrict the maternal uterine blood vessels.");
  mc("postpartum", "A nurse is caring for a client who is postpartum and is breastfeeding. The client states that she is concerned about dietary precautions since she has a family history of food allergies .The nurse offers which of the following responses?",
    ["\"You might want to avoid eating peanuts.\"", "\"Rice cereals can be a problem during lactation.\"", "\"Foods you eat do not affect breast milk.\"", "\"The infant needing more sleep can indicate a food allergy.\""], 0,
    "There are no standard foods that are contraindicated during breastfeeding. With a family history of food allergies, it is important to avoid eating highly allergenic foods, such as peanuts, as well as other foods to which the client has a known allergy.");
  sata("postpartum", "A nurse on a postpartum unit is giving discharge instructions to a client whose newborn had a circumcision with the Plastibell technique. Which of the following client statements indicates understanding of circumcision care? (Select all that apply.)",
    ["\"I'll expect the plastic ring to fall off by itself within a week.\"", "\"I'll apply petroleum jelly to his penis with diaper changes.\"", "\"I'll wash his penis with warm water and mild soap each day.\"", "\"I'll call the doctor if I see any bleeding.\"", "\"I'll make sure his diaper is loose in the front.\""], [0, 3, 4],
    "<b>Ill expect the plastic ring to fall off by itself within a week is a correct statement.</b> With the Plastibell procedure, the plastic ring detaches in about 5 to 8 days.<br><Br><B>Ill apply petroleum jelly to his penis with diaper changes is an incorrect statement.</b> With the Plastibell technique, no petroleum jelly is necessary.<br><Br><b>Ill wash his penis with warm water and mild soap each day is an incorrect statement.</b> The client should not use soap or commercial cleansing wipes until the circumcision has healed, which takes at least 5 to 6 days.<Br><bR><b>Ill call the doctor if I see any bleeding is a correct statement.</b> The client should report any bleeding immediately.<br><Br><b>Ill make sure his diaper is loose in the front is a correct statement.</b> Applying a loose diaper prevents pressure over the circumcision area.");
  mc("postpartum", "A nurse is assisting a client who is postpartum with her first breastfeeding experience. When the client asks how much of the nipple she should put into the newborn's mouth, which of the following responses should the nurse make?",
    ["\"You should place your nipple and some of the areola into her mouth.\"", "\"Babies know instinctively how much of the nipple to take into their mouth.\"", "\"Your baby's mouth is rather small so she will only take part of the nipple.\"", "\"Try to place the nipple, the areola, and some breast tissue beyond the areola into her mouth.\""], 0,
    "Placing the nipple and 2 to 3 cm of areolar tissue around the nipple into the baby's mouth aids in adequately compressing the milk ducts. This placement decreases stress on the nipple and prevents cracking and soreness.");
  mc("postpartum", "A nurse is caring for a client 2 hr after a spontaneous vaginal birth and the client has saturated two perineal pads with blood in a 30-min period. Which of the following is the priority nursing intervention at this time?",
    ["Palpate the client's uterine fundus.", "Assist the client on a bedpan to urinate.", "Prepare to administer oxytocic medication.", "Increase the client's fluid intake."], 0,
    "Although the expectation is moderate bleeding in the first 2 hr after delivery, saturating a perineal pad in 15 min or less indicates excessive blood loss. The priority nursing intervention is to palpate the client's fundus to determine the presence of uterine atony, followed by fundal massage to stimulate uterine muscle tone.");
  mc("postpartum", "A nurse is caring for a client who experienced a vaginal birth 3 hr ago. Upon palpation, the fundus is displaced to the right of midline, is firm, and is two fingerbreadths above the umbilicus. Which of the following actions should the nurse complete at this time?",
    ["Massage the fundus.", "Insert a urinary catheter.", "Have the client urinate.", "Administer an analgesic."], 2,
    "A full bladder displaces the uterine fundus and elevates it above the level of the umbilicus. This can lead to uterine atony and excessive bleeding. Having the client urinate allows the uterus to return to midline and remain below the umbilicus.");
  mc("postpartum", "A nurse is caring for a client who is 1 day postpartum and is taking a sitz bath. To determine the client's tolerance of the procedure, which of the following assessments should the nurse perform?",
    ["Bladder distention", "Pulse rate", "Respiratory rate", "Color of lochia"], 1,
    "A sitz bath causes vasodilation; therefore, the nurse should monitor the client's pulse rate. Orthostatic hypotension can occur upon standing causing the client to feel faint.");
  sata("postpartum", "A nurse in a pediatric clinic is caring for a client who is postpartum and asks the nurse what to do when her newborn cries persistently. Which of the following strategies should the nurse suggest? (Select all that apply.)",
    ["Take the newborn for a ride in the car.", "Keep the newborn in the center of a large crib.", "Carry the newborn in a front or back pack.", "Swaddle the newborn in a receiving blanket.", "Allow the newborn to continue crying."], [0, 2, 3],
    "Answer key taken from your question bank. Review this topic in your notes.");
  mc("postpartum", "A nurse is caring for a client who experienced a vaginal birth 12 hr ago. The nurse recognizes the client is in the dependent, taking in phase of maternal postpartum adjustment. Which of the following findings should the nurse expect during this phase?",
    ["Expressions of excitement", "Lack of appetite", "Focus on the family unit and its members", "Eagerness to learn newborn care skills"], 0,
    "Expressing excitement and being talkative are characteristic of this phase.");
  mc("postpartum", "A nurse in a clinic is caring for a client who is 3 weeks postpartum following the birth of a healthy newborn. The client reports feeling \"down\" and sad, having no energy, and wanting to cry. Which of the following is a priority action by the nurse?",
    ["Assist the family to identify prior use of positive coping skills in family crises.", "Ask the client if she has considered harming her newborn.", "Anticipate a prescription by the provider for an antidepressant.", "Reinforce postpartum and newborn care discharge teaching."], 1,
    "When using the nursing process in caring for a client, the first action should focus on assessment of the client's mood, ability to concentrate, thought processes, and if the client has had thoughts of self-harm or of injuring her newborn.");
  mc("postpartum", "A nurse is caring for a client who is 6 hours postpartum and asks the nurse to feed her newborn. Which of the following responses should the nurse provide?",
    ["\"I'll feed him today. Maybe tomorrow you can try it.\"", "\"Oh, this isn't difficult. You'll be fine doing this.\"", "\"You can learn to feed him; I wasn't comfortable the first time I fed a baby either.\"", "\"Feeding an infant can feel a little intimidating at first, but I'll stay and help you.\""], 3,
    "The nurse, while recognizing and acknowledging the client's apprehension, offers assistance and a sense of presence, with the intention of boosting client confidence.");
  mc("postpartum", "A nurse is caring for a client who experienced a cesarean birth due to dysfunctional labor. The client states that she is disappointed that she did not have natural childbirth. Which of the following responses should the nurse make?",
    ["\"It sounds like you are feeling sad that things didn't go as planned.\"", "\"At least you know you have a healthy baby.\"", "\"Maybe next time you can have a vaginal delivery.\"", "\"You can resume sexual relations sooner than if you had delivered vaginally.\""], 0,
    "This response uses the therapeutic communication technique of restating to encourage the client to continue to communicate her feelings.");
  mc("postpartum", "A nurse is caring for a client who is 16 -hr postpartum and states \"My baby has been breathing funny, fast and slow, off and on.\" Which of the following responses should the nurse provide?",
    ["\"Most new mothers feel somewhat anxious about things like this.\"", "\"There's nothing for you to worry about. Newborns often breathe this way.\"", "\"Why do you think there is something wrong with that?\"", "\"Let's sit here together and observe your baby while you feed him.\""], 3,
    "With this response, the nurse is using the therapeutic communication techniques of focusing and physical attending.");
  mc("postpartum", "A nurse is planning care for a client who is 2 hours postpartum following a cesarean birth. The client has a history of thromboembolic disease. Which of the following nursing interventions should be included in the plan of care?",
    ["Apply warm, moist heat to the client's lower extremities.", "Massage the client's posterior lower legs.", "Place pillows under the client's knees when resting in bed.", "Have the client ambulate."], 3,
    "Venous stasis is a major cause of thrombophlebitis. To prevent clot formation, have the client ambulate as soon as she can after delivery and as often as possible.");
  mc("postpartum", "A nurse on the postpartum unit is caring for a group of clients with an assistive personnel (AP). Which of the following tasks should the nurse plan to delegate to the AP?",
    ["Provide a sitz bath to a client who has a fourth-degree laceration and is 2 days postpartum.", "Observe an area of redness on the breast of a client who is 1 day postpartum.", "Monitor vital signs during admission of a client who has gestational hypertension.", "Change the perineal pad of a client who just transferred from labor and delivery."], 0,
    "Providing comfort measures is an appropriate task that can be delegated to the AP since it does not require nursing judgment.");
  mc("postpartum", "A nurse is assessing a client for postpartum infection. Which of the following findings should indicate to the nurse that the client requires further evaluation for endometritis?",
    ["Moderate amount of dark red lochia with a bloody odor", "A localized area of breast tenderness", "Pelvic pain", "Hematuria"], 2,
    "Indications of endometritis, the most common postpartum infection, include chills, fever, tachycardia, anorexia, fatigue, and pelvic pain.");
  mc("postpartum", "A nurse is caring for a client who is in labor at 40 weeks of gestation and reports that she has saturated two perineal pads in the past 30 min. The nurse caring for her suspects placenta previa. Which of the following is an appropriate nursing action?",
    ["Examination to determine cervical status", "A magnesium sulfate infusion", "Initiation of pushing", "Preparation for cesarean birth"], 3,
    "A cesarean birth is indicated for all clients who have a confirmed placenta previa.");
  mc("postpartum", "A nurse is caring for a client who is 7 days postpartum and calls the clinic to report pain and redness of her left calf. Besides seeing her provider, which of the following interventions should the nurse suggest?",
    ["Flex her knee while resting.", "Massage the area.", "Elevate her leg.", "Apply cold compresses."], 2,
    "The client should elevate her leg to encourage venous return and to relieve pain.");
  mc("postpartum", "A nurse is caring for a client who is 2 hr postpartum following a vaginal birth. Which of the following findings indicates the client's bladder is distended?",
    ["Client report of frequent uterine contractions", "Less than 2.5 cm of rubra lochia on perineal pad", "Fundus palpable to right of midline", "Client report of increased thirst"], 2,
    "Bladder distention results in uterine displacement, pushing the fundus above the umbilicus and away from the midline. The fundus might feel boggy to palpation and does not contract normally.");
  mc("postpartum", "A nurse is caring for a client who is 12 hr postpartum. Which of the following findings should alert the nurse to the possibility of a postpartum complication?",
    ["Orthostatic hypotension", "Fundus palpable at the umbilicus", "Urine output of 3,000 mL in 12 hr", "Heart rate 110/min"], 3,
    "A rapid or increasing heart rate can be a manifestation of fluid volume depletion related to hemorrhage. The nurse should further evaluate the client for evidence of postpartum hemorrhage.");
  sata("postpartum", "A nurse is providing discharge teaching to a client who is 3 days postoperative following a cesarean birth. Which of the following client statements should indicate to the nurse the teaching is effective? (Select all that apply.)",
    ["\"I am likely to have a fever during the first week I am home.\"", "\"I will resume taking my prenatal vitamins.\"", "\"I will call my provider if I have discharge from my incision.\"", "\"I should not have unrelieved pain in my abdomen.\"", "\"I will rest in a recliner until my incision is healed.\""], [1, 2, 3],
    "Answer key taken from your question bank. Review this topic in your notes.");
  mc("postpartum", "A nurse is assessing a client who is 4 hr postpartum following a vaginal delivery. Which of the following findings should the nurse identify as the priority?",
    ["Saturated perineal pad in 30 min", "Deep tendon reflexes 4+", "Fundus at level of umbilicus", "Approximated edges of episiotomy"], 1,
    "Deep tendon reflexes 4+ are hyperactive and indicate that the client is at greatest risk for preeclampsia and seizures. The nurse should identify this as the priority finding. The nurse should also monitor for headaches, visual disturbances and epigastric pain. The provider will likely prescribe magnesium sulfate IV infusion.");
  mc("postpartum", "A nurse is caring for a client who is 2 hr postpartum. The nurse notes that the client soaked a perineal pad in 10 min, the client's skin color is ashen, and she states she feels weak and light headed. After applying oxygen via nonrebreather face mask at 10 L/min which of the following actions should the nurse take next?",
    ["Insert an indwelling urinary catheter.", "Administer oxytocin by continuous IV infusion.", "Tilt the client onto her right side with her legs elevated to at least 30&deg.", "Massage the client's fundus to promote contractions."], 3,
    "A soaked perineal pad in less than 15 min, ashen skin color, and report of weakness and light headedness can indicate that the client is at greatest risk for hypovolemic shock. Therefore, the next action the nurse should take is to massage the client's fundus to expel blood clots and promote uterine contraction to stop the bleeding.");
  sata("postpartum", "A nurse is reinforcing teaching about reducing perineal infection with a client following a vaginal delivery. Which of the following should the nurse include in the teaching? (Select all that apply.)",
    ["Blot the perineal area dry after cleansing.", "Clean the perineal area from front to back.", "Perform hand hygiene before and after voiding.", "Apply ice packs to the perineal area several times daily.", "Wash the perineal area using a squeeze bottle of warm water after each voiding."], [0, 1, 2, 4],
    "<b>Blot the perineal area dry is correct.</b> Good perineal care is important to clean the skin folds, which often contain secretions that act as a medium for micro-organism growth. Therefore, the area should be thoroughly dried by blotting.<br><br><b>Clean the perineal area from front to back is correct.</b> Good perianal care is important to clean the skin folds, which often contain secretions that harbor micro-organisms. Wiping from front to back decreases the chances of transmitting fecal organisms to other areas, such as the urinary meatus, episiotomy incision, or lacerations resulting from childbirth.<br><br><b>Perform hand hygiene before and after voiding is correct.</b> Hand hygiene is the primary method of reducing micro-organisms on the hands and thereby reducing the risk of transmission that can lead to infection.<br><br><b>Apply ice packs to the perineal area several times daily is incorrect.</b> Ice packs may be applied to the perineal area for the first 24 to 48 hr to decrease edema and to provide an anesthetic effect. This would not be indicated after that time, nor does it provide any preventative benefits from infection.<Br><br><b>Wash the perineal area using a squeeze bottle of warm water after each voiding is correct.</b> Rinsing with a solution of water is more effective at removing micro-organisms than wiping.");
  mc("postpartum", "A nurse is reinforcing teaching about newborn care with a postpartum client. Which of the following statements by the client indicates a need for further teaching?",
    ["\"I will use mild soap.\"", "\"I will use a basin during bathing.\"", "\"Baby powder will help prevent a diaper rash.\"", "\"I will test the water on my wrist for temperature before bathing.\""], 2,
    "Lotions, creams, oils, or powders can alter a newborn's skin and provide a medium for bacterial growth or cause an allergic response. Powders can be inhaled, leading to respiratory distress. This statement requires the nurse to clarify instruction on newborn care.");
  mc("postpartum", "A nurse is caring for a client who reports unrelieved episiotomy pain 8 hr following a vaginal birth. Which of the following actions should the nurse take?",
    ["Apply an ice pack to the affected area.", "Offer a warm sitz bath.", "Provide a squeeze bottle of antiseptic solution.", "Place a hot pack to the perineum."], 0,
    "During the first 24 hr, ice packs and cool water sitz baths are used. They reduce edema and promote comfort. The client may also apply witch hazel compresses to reduce edema. The nurse should instruct the client on the use of prescribed anesthetic creams, sprays, and ointments.");
  mc("postpartum", "A nurse is providing teaching about comfort measures for breast engorgement to a client who is postpartum and is breastfeeding. Which of the following statements by the client indicates a need for further teaching?",
    ["\"I will breastfeed every 2 hours.\"", "\"I will apply ice packs to my breasts after feeding.\"", "\"I should apply hot packs to my breasts during feeding.\"", "\"I should crush cabbage leaves and place them on my breasts.\""], 2,
    "The application of heat promotes increased blood flow to the breasts, which are already engorged. This is not an appropriate intervention.");
  mc("postpartum", "A nurse is providing teaching about newborn care to a client who is 2 hr postpartum. Which of the following statements by the client indicates a need for further teaching?",
    ["\"I should keep my baby's head covered.\"", "\"My baby's temperature will be checked rectally every hour.\"", "\"I should place my baby on my stomach and cover her with a warm blanket.\"", "\"My baby's bassinet should be kept away from fans and air conditioning.\""], 1,
    "The newborn's axillary temperature should be checked every hour until the newborn's temperature stabilizes. Frequent rectal temperature checks are not recommended and can lead to rectal mucosal injury.");
  mc("postpartum", "A nurse is assessing a client who is 12 hr postpartum and received spinal anesthesia for a cesarean birth. Which of the following findings requires immediate intervention by the nurse?",
    ["Blood pressure 100/70 mm Hg", "Headache pain rated a 6 on a scale of 0 to 10", "Respiratory rate 10/min", "Urinary output 30 mL/hr"], 2,
    "A client who has received spinal anesthesia is at risk for respiratory depression and hypotension. A respiratory rate of 10/min indicates bradypnea and requires immediate intervention.");
  mc("postpartum", "A nurse is caring a client who is 3 days postpartum and is attempting to breastfeed. Which of the following findings indicate mastitis?",
    ["Swelling in both breasts", "Cracked and bleeding nipples", "Red and painful area in one breast", "A white patch on a nipple"], 2,
    "Mastitis often appears as a red, hard, and painful area on the breast, commonly in the upper outer quadrant. Although mastitis can occur in both breasts, it is usually unilateral. A client who has mastitis can also influenza-like manifestations, such as fever, chills, headache, and myalgia. After delivery, the nurse should instruct the client to observe the breasts for indications of mastitis and to notify her provider if they occur.");
  mc("postpartum", "A nurse is performing a physical examination of a client who is 1 day postpartum. Which of the following findings requires immediate intervention?",
    ["Decreased urge to void", "Increased urine output", "Displaced fundus from the midline", "Fundal height below the umbilicus"], 2,
    "A distended bladder can cause uterine atony and lateral displacement of the fundus from the midline of the lower abdomen, usually to the right. This requires immediate intervention because the distended bladder pushes the uterus up and to the side, which prevents it from contracting firmly. Uterine atony results from the inability of the uterine muscle to contract adequately after birth. This can lead to postpartum hemorrhage.");
  mc("postpartum", "Postpartum depression occurs in about 30 percent of postpartum women. Which prenatal client would the nurse consider at greatest risk for postpartum depression?",
    ["A client who has strong family support", "A client who has previously had postpartum blues", "A client with ambivalence about her pregnancy in the first trimester", "A client who lacks a supportive relationship"], 2,
    "Answer key taken from your question bank. Review this topic in your notes.");
  sata("postpartum", "A postpartum client delivered a 9lb boy vaginally 2 hours ago, without episiotomy or lacerations. The nurse notes the fundus is at the umbilicus and not firm, with heavy lochia rubra and large clots, and no edema of the legs. Which priority actions by the nurse are needed. Select all apply",
    ["Massage the fundus and recheck bleeding", "Assist the mother out of bed to void", "Maintain IV 0.9 normal saline with 30 units of Pitocin", "Assess mother vitals signs", "Notify the physician on call immediately"], [0, 2, 3, 4],
    "Answer key taken from your question bank. Review this topic in your notes.");
  mc("postpartum", "The nurse interprets which of the following as evidence that a client is in the taking in phase?",
    ["Client preforms self-care after receiving instructions from the nurse", "Client states she is ready to learn from the nurse how to change the diaper", "Client counts the newborn’s fingers and toes", "Client begins to care for the newborn"], 2,

  mc("contra", "A nurse in a family planning clinic is caring for a 17-year-old female client who is requesting oral contraceptives. The client states that she is nervous because she has never had a pelvic examination. Which of the following responses should the nurse make?",

  mc("contra", "A nurse is caring for a client who is considering several methods of contraception. Which of the following methods of contraception should the nurse identify as being most reliable?",

  mc("contra", "A nurse is leading a discussion about contraception with a group of 14-year-old clients. After the presentation, a client asks the nurse which method would be best for her to use. Which of the following responses should the nurse make?",

  mc("contra", "A nurse is reviewing contraception options for four clients. The nurse should identify that which of the following clients has a contraindication for receiving oral contraceptives?",

  mc("contra", "A nurse is reinforcing teaching about contraceptive methods with a client. Which of the following should the nurse recognize as a contraindication for diaphragm use?",
