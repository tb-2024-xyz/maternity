<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NUR 270A Exam 3 Prep</title>
  <meta name="description" content="Practice questions for NUR 270A Exam 3: newborn and high-risk newborn, postpartum and complications, mother and newborn meds, contraception, and medication math.">
  <style>
:root {
  --ink: #16263a;
  --muted: #5a6b7d;
  --paper: #f5f9f9;
  --card: #ffffff;
  --line: #cfe0e0;
  --teal: #0e6b6b;
  --teal-deep: #0a4f4f;
  --teal-soft: #dcefef;
  --right: #2b7a4b;
  --right-soft: #e1f2e8;
  --wrong: #b3412a;
  --wrong-soft: #f8e4de;
  --amber: #b7791f;
  --focus: #1d4ed8;
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --ink: #e6eef3;
    --muted: #9db0bf;
    --paper: #0f1a24;
    --card: #162433;
    --line: #28404f;
    --teal: #4fc3c3;
    --teal-deep: #7bd9d9;
    --teal-soft: #17353d;
    --right: #66c48a;
    --right-soft: #17332560;
    --wrong: #f08c75;
    --wrong-soft: #3b2420;
    --amber: #e5b25d;
    --focus: #8fb4ff;
  }
}

* { box-sizing: border-box; }
html { font-size: 17px; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.5;
}

:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button { font: inherit; color: inherit; }

.wrap { max-width: 860px; margin: 0 auto; padding: 0 1.25rem; }

/* ----- header ----- */
.top { border-bottom: 1px solid var(--line); background: var(--card); }
.top .wrap { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; padding-top: 1rem; padding-bottom: 1rem; }
.brand { font-family: var(--serif); font-size: 1.25rem; font-weight: 700; margin: 0; }
.brand small { font-family: var(--sans); font-weight: 400; color: var(--muted); font-size: 0.85rem; margin-left: 0.5rem; }
.linkbtn { background: none; border: 0; color: var(--teal); text-decoration: underline; cursor: pointer; padding: 0.25rem; }

main { padding: 1.75rem 0 4rem; }
h2 { font-family: var(--serif); font-size: 1.5rem; margin: 0 0 0.35rem; }
h3 { font-family: var(--serif); font-size: 1.1rem; margin: 1.5rem 0 0.5rem; }
.lede { color: var(--muted); margin: 0 0 1.5rem; max-width: 60ch; }

/* ----- panels ----- */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.25rem; margin-bottom: 1.25rem; }
.panel > h3:first-child { margin-top: 0; }

.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
.mode { position: relative; display: block; border: 1.5px solid var(--line); border-radius: 8px; padding: 0.85rem 1rem; cursor: pointer; background: var(--card); }
.mode input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.mode strong { display: block; font-family: var(--serif); font-size: 1.05rem; }
.mode span { color: var(--muted); font-size: 0.88rem; }
.mode:has(input:checked) { border-color: var(--teal); background: var(--teal-soft); }
.mode:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }

fieldset { border: 0; padding: 0; margin: 0; }
legend { font-family: var(--serif); font-weight: 700; margin-bottom: 0.4rem; padding: 0; }
.chapter { margin: 0 0 0.9rem; }
.chapter-head { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; margin-bottom: 0.3rem; }
.topics { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chip { position: relative; display: inline-flex; align-items: center; gap: 0.35rem; border: 1px solid var(--line); border-radius: 999px; padding: 0.3rem 0.8rem; font-size: 0.9rem; cursor: pointer; background: var(--card); }
.chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chip:has(input:checked) { background: var(--teal); color: #fff; border-color: var(--teal); }
@media (prefers-color-scheme: dark) { .chip:has(input:checked) { color: #0b1620; } }
.chip:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.chip em { font-style: normal; opacity: 0.75; font-size: 0.8rem; }

.row { display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; align-items: center; margin-top: 1rem; }
select { font: inherit; padding: 0.35rem 0.5rem; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
.check { display: inline-flex; align-items: center; gap: 0.4rem; }

.btn { background: var(--teal); color: #fff; border: 0; border-radius: 8px; padding: 0.65rem 1.3rem; font-weight: 600; cursor: pointer; }
@media (prefers-color-scheme: dark) { .btn { color: #0b1620; } }
.btn:hover { background: var(--teal-deep); }
@media (prefers-color-scheme: dark) { .btn:hover { color: #0b1620; } }
.btn.ghost { background: transparent; color: var(--teal); border: 1.5px solid var(--teal); }
.btn.ghost:hover { background: var(--teal-soft); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.25rem; align-items: center; }
.spacer { flex: 1; }

/* ----- progress by topic ----- */
.bars { display: grid; gap: 0.6rem; }
.bar-row { display: grid; grid-template-columns: minmax(150px, 1.2fr) 3fr auto; gap: 0.75rem; align-items: center; font-size: 0.92rem; }
.bar { height: 10px; background: var(--teal-soft); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--teal); }
.bar i.low { background: var(--wrong); }
.bar i.mid { background: var(--amber); }
.bar i.hi { background: var(--right); }
.num { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 6.5em; text-align: right; }

/* ----- rhythm strip (progress) ----- */
.strip { display: flex; align-items: flex-end; gap: 0; margin: 0 0 1.25rem; overflow-x: auto; padding-bottom: 4px; }
.beat { flex: 0 0 auto; width: 28px; height: 30px; padding: 0; background: none; border: 0; cursor: pointer; }
.beat svg { display: block; width: 100%; height: 100%; }
.beat path { fill: none; stroke: var(--line); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.beat.seen path { stroke: var(--teal); }
.beat.right path { stroke: var(--right); }
.beat.wrong path { stroke: var(--wrong); }
.beat.flagged path { stroke-dasharray: 3 2; }
.beat.current { background: var(--teal-soft); border-radius: 4px; }
.plainbar { height: 8px; background: var(--teal-soft); border-radius: 999px; overflow: hidden; margin: 0 0 1.25rem; }
.plainbar i { display: block; height: 100%; background: var(--teal); }

/* ----- question ----- */
.meta { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; color: var(--muted); font-size: 0.88rem; margin-bottom: 0.6rem; }
.tag { background: var(--teal-soft); color: var(--teal-deep); border-radius: 4px; padding: 0.1rem 0.5rem; }
.timer { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
.timer.low { color: var(--wrong); }
.stem { font-family: var(--serif); font-size: 1.2rem; line-height: 1.45; margin: 0 0 1rem; max-width: 62ch; }
.hint { color: var(--muted); font-size: 0.9rem; margin: -0.5rem 0 0.9rem; }
.bars + .hint { margin: 1rem 0 0; }

.opts { display: grid; gap: 0.5rem; margin: 0; padding: 0; list-style: none; }
.opt { position: relative; display: flex; gap: 0.75rem; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 8px; padding: 0.7rem 0.9rem; background: var(--card); cursor: pointer; }
.opt input { margin-top: 0.3rem; accent-color: var(--teal); }
.opt:has(input:checked) { border-color: var(--teal); background: var(--teal-soft); }
.opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.opt.right, .opt.right:has(input:checked) { border-color: var(--right); background: var(--right-soft); }
.opt.wrong, .opt.wrong:has(input:checked) { border-color: var(--wrong); background: var(--wrong-soft); }
.opt.missed { border-style: dashed; border-color: var(--right); }
.locked .opt { cursor: default; }
.mark { margin-left: auto; font-size: 0.82rem; font-weight: 600; white-space: nowrap; }
.right .mark { color: var(--right); }
.wrong .mark { color: var(--wrong); }
.missed .mark { color: var(--right); }

.fill { width: 100%; max-width: 24rem; font: inherit; padding: 0.6rem 0.75rem; border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
.fill.right { border-color: var(--right); background: var(--right-soft); }
.fill.wrong { border-color: var(--wrong); background: var(--wrong-soft); }

.seq { display: grid; gap: 0.5rem; margin: 0; padding: 0; list-style: none; }
.seq li { display: flex; align-items: center; gap: 0.6rem; border: 1.5px solid var(--line); border-radius: 8px; padding: 0.55rem 0.75rem; background: var(--card); }
.seq .pos { font-weight: 700; color: var(--teal); min-width: 1.4em; }
.seq .txt { flex: 1; }
.seq button { border: 1px solid var(--line); background: var(--card); border-radius: 6px; width: 2rem; height: 2rem; cursor: pointer; }
.seq button[disabled] { opacity: 0.35; cursor: not-allowed; }
.seq li.right { border-color: var(--right); background: var(--right-soft); }
.seq li.wrong { border-color: var(--wrong); background: var(--wrong-soft); }

.feedback { margin-top: 1.1rem; border-left: 4px solid var(--teal); background: var(--teal-soft); padding: 0.8rem 1rem; border-radius: 0 8px 8px 0; }
.feedback.right { border-color: var(--right); background: var(--right-soft); }
.feedback.wrong { border-color: var(--wrong); background: var(--wrong-soft); }
.feedback strong { display: block; margin-bottom: 0.25rem; }
.feedback p { margin: 0.25rem 0 0; }
.feedback .ref { color: var(--muted); font-size: 0.88rem; }

/* ----- results ----- */
.score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem 1.25rem; margin-bottom: 0.5rem; }
.score .big { font-family: var(--serif); font-size: 2.6rem; font-weight: 700; line-height: 1; }
.review { display: grid; gap: 0.75rem; margin-top: 1rem; }
.review details { border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.review summary { cursor: pointer; padding: 0.7rem 0.9rem; display: flex; gap: 0.6rem; align-items: baseline; }
.review summary .ok { color: var(--right); font-weight: 700; }
.review summary .no { color: var(--wrong); font-weight: 700; }
.review .body { padding: 0 0.9rem 0.9rem; }
.review .body p { margin: 0.35rem 0; }
.empty { color: var(--muted); }

@media (max-width: 640px) {
  html { font-size: 16px; }
  .modes { grid-template-columns: 1fr; }
  .bar-row { grid-template-columns: 1fr; gap: 0.2rem; }
  .num { text-align: left; }
  .stem { font-size: 1.12rem; }
}

@media (prefers-reduced-motion: no-preference) {
  .bar i, .plainbar i { transition: width 0.4s ease; }
}

</style>

  <header class="top">
    <div class="wrap">
      <h1 class="brand">NUR 270A Exam 3 Prep <small>Newborn, postpartum, meds, contraception</small></h1>
      <button type="button" class="linkbtn" id="homeLink">Setup</button>
    </div>

  <main class="wrap" id="app" tabindex="-1">
    <noscript>This practice app needs JavaScript turned on.</noscript>
  </main>
  <script>

/* NUR 270A Exam 3 question bank (maternity)
 * Built from every question bank you uploaded (ATI, Kiraly, Exam 3 and final question files) and the Exam 3 blueprint. Question types: mc (one answer), sata (select all), fill (short answer), order (sequence).
 *
 * To add a question, append a line below using one of the helpers:
 *   mc(topicId, stem, [options], correctIndex, rationale)
 *   sata(topicId, stem, [options], [correctIndexes], rationale)
 *   fill(topicId, stem, [acceptedAnswers], rationale)
 *   order(topicId, stem, [itemsInCorrectOrder], rationale)
 * Progress is keyed to a hash of the stem, so editing a stem resets that question's history.
 */
(function () {
  "use strict";

  window.CHAPTERS = {
    nb: "Newborn & High-Risk Newborn",
    pp: "Postpartum & Complications",
    rx: "Meds, Contraception & Math",
    pr: "Prenatal, Labor & Delivery (earlier exams)"
  };

  window.TOPICS = [
    { id: "newborn", label: "Newborn care and high-risk newborn", chapter: "nb", ref: "Newborn & High-Risk Newborn notes" },
    { id: "postpartum", label: "Postpartum assessment and complications", chapter: "pp", ref: "Post-Partum notes" },
    { id: "meds", label: "Mother and newborn meds", chapter: "rx", ref: "Mother Meds and NB Meds notes" },
    { id: "contra", label: "Contraception", chapter: "rx", ref: "Contraception notes" },
    { id: "math", label: "Medication math and calculations", chapter: "rx", ref: "Dosage calculation practice" },
    { id: "prenatal", label: "Prenatal, labor and delivery", chapter: "pr", ref: "Prenatal and labor notes" }
  ];

  var Q = [];
  function hash(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) | 0; }
    return "q" + (h >>> 0).toString(36);
  }
  function add(type, topic, q, opts, a, why) {
    Q.push({ id: hash(topic + q), type: type, topic: topic, q: q, opts: opts, a: a, why: why });
  }
  function mc(t, q, o, a, w) { add("mc", t, q, o, a, w); }
  function sata(t, q, o, a, w) { add("sata", t, q, o, a, w); }
  function fill(t, q, acc, w) { add("fill", t, q, null, acc, w); }
  function order(t, q, items, w) { add("order", t, q, items, null, w); }

  /* ---------- NEWBORN AND HIGH-RISK NEWBORN ---------- */
  mc("newborn", "A nurse is caring for a newborn immediately following birth. After assuring a patent airway, what is the priority nursing action?",
    ["Administer vitamin K.", "Dry the skin.", "Administer eye prophylaxis.", "Place an identification bracelet."], 1,
    "The newborn should be thoroughly dried, covered with a warm blanket, placed on the mother's abdomen, and a cap applied to the newborn's head to prevent cold stress. The newborn responds to the cooler environment by increasing his respiratory rate, which can lead to respiratory distress. Based on Maslow's hierarchy of needs, this is the most important nursing action after securing the airway.");
  mc("newborn", "A nurse is caring for a client who just delivered a newborn. Following the delivery, which nursing action should be done first to care for the newborn?",
    ["Clear the respiratory tract.", "Dry the infant off and cover the head.", "Stimulate the infant to cry.", "Cut the umbilical cord."], 0,
    "Clearing the airway of the infant is the first action the nurse should take immediately following delivery.");
  mc("newborn", "A nurse in labor and delivery is caring for a client. Following delivery of the placenta, the nurse examines the umbilical cord. Which of the following vessels should the nurse expect to observe in the umbilical cord?",
    ["Two veins and one artery", "One artery and one vein", "Two arteries and one vein", "Two arteries and two veins"], 2,
    "The vein carried the oxygenated, nutrient-rich blood from the placenta to the fetus, and the two arteries returned the blood to the placenta.");
  mc("newborn", "A nurse is caring for a new mother who is concerned that her newborn's eyes cross. Which of the following statements is a therapeutic response by the nurse?",
    ["\"I will call your primary care provider to report your concerns.\"", "\"I will take your baby to the nursery for further examination.\"", "\"This occurs because newborns lack muscle control to regulate eye movement.\"", "\"This is a concern, but strabismus is easily treated with patching.\""], 2,
    "This addresses the client's concerns because it provides information that addresses her concerns. The eyes of newborns are structurally incomplete and muscle control is not fully developed for 3 months.");
  mc("newborn", "A nurse is caring for a client who is at 40 weeks of gestation and is in labor. The client's ultrasound examination indicates that the fetus is small for gestational age (SGA). Which of the following interventions should be included in the newborn's plan of care?",
    ["Observe for meconium in respiratory secretions.", "Monitor for hyperglycemia.", "Identify manifestations of anemia.", "Monitor for hyperthermia."], 0,
    "When a fetus is SGA, there is an increased risk for intrauterine hypoxia due to the presence of meconium in the amniotic fluid. The nurse should observe for meconium in respiratory secretions when suctioning the newborn at delivery. Newborns who are SGA are at risk for perinatal asphyxia due to the stress of labor and are often depressed. They require careful resuscitation and suctioning at delivery.");
  mc("newborn", "A nurse is instructing a woman who is contemplating pregnancy about nutritional needs. To reduce the risk of giving birth to a newborn who has a neural tube defect, which of the following information should the nurse include in the teaching?",
    ["Limit alcohol consumption.", "Increase intake of iron-rich foods.", "Consume foods fortified with folic acid.", "Avoid foods containing aspartame."], 2,
    "Increased consumption of folic acid in the 3 months prior to conception, as well as throughout the pregnancy, reduces the incidence of neural tube defects in the developing fetus.");
  sata("newborn", "A nurse is preparing to assess a newborn who is postmature. Which of the following findings should the nurse expect? (Select all that apply.)",
    ["Cracked, peeling skin", "Positive Moro reflex", "Short, soft fingernails", "Abundant lanugo", "Vernix in the folds and creases"], [0, 1],
    "Answer key taken from your question bank. Review this topic in your notes.");
  mc("newborn", "A nurse is caring for a client who is in the first stage of labor. The nurse observes the umbilical cord protruding from the vagina. Which of the following actions should the nurse perform first?",
    ["Cover the cord with a sterile, moist saline dressing.", "Prepare the client for an immediate birth.", "Place the client in knee-chest position.", "Insert a gloved hand into the vagina to relieve pressure on the cord."], 3,
    "This is the first nursing action because it is essential to prevent any pressure on the umbilical cord to promote oxygenation of the fetus.");
  mc("newborn", "A nurse in a prenatal clinic is caring for a client who is at 38 weeks of gestation and reports heavy, red vaginal bleeding. The bleeding started spontaneously in the morning and is not accompanied by contractions. The client is not in distress and she states that she can \"feel the baby moving.\" An ultrasound is scheduled stat. The nurse should explain to the client that the purpose of the ultrasound is to determine which of the following?",
    ["Fetal lung maturity", "Location of the placenta", "Viability of the fetus", "The biparietal diameter"], 1,
    "Painless, spontaneous vaginal bleeding might indicate that the client has placenta previa. Placenta previa is a condition in which the placenta is implanted low in the uterus, sometimes to the point of covering the cervical os. As the cervix effaces, the client begins to bleed. The ultrasound will show the location of the placenta and help to determine what sort of delivery the client requires and how emergent it is.");
  mc("newborn", "A nurse is caring for a client who delivered a healthy term newborn via cesarean birth. The client asks the nurse, \"Is there a chance that I could deliver my next baby without having a cesarean section?\" Which of the following responses should the nurse provide?",
    ["\"The primary consideration is what type of incision was performed this time.\"", "\"There are so many variables that you'll have to ask your obstetrician.\"", "\"It's too soon for you to be worrying about this now.\"", "\"A repeat cesarean birth is safer for both you and your baby.\""], 0,
    "The most common type of incision during a cesarean birth is transverse, which is made across the lower, thinner part of the uterus. It is the primary criteria that permits a vaginal birth after a cesarean (VBAC). Other types of incisions increase the risk of uterine rupture. Additional criteria for VBAC include an adequate maternal pelvis, no uterine scars or history of rupture, the availability of a provider to monitor labor, and personnel to perform a cesarean birth if needed.");
  mc("newborn", "A nurse is caring for a client who is in preterm labor at 32 weeks of gestation. The client asks the nurse, \"Will my baby be okay?\" Which of the following responses should the nurse offer?",
    ["\"You must be feeling scared and powerless.\"", "\"Everyone worries about her baby when she's in labor.\"", "\"Your pregnancy is advanced so your baby should be fine.\"", "\"We have a neonatal unit here that's equipped to handle emergencies.\""], 0,
    "This response illustrates the therapeutic communication technique of restatement. The nurse shows empathy for the client by recognizing that the client is concerned about the safety of the fetus and is powerless to do anything about the situation. This open-ended statement encourages further communication by the client.");
  mc("newborn", "A nurse is caring for a newborn who has myelomeningocele. Which of the following nursing goals has the priority in the care of this infant?",
    ["Maintain the integrity of the sac.", "Promote maternal-infant bonding.", "Educate the parents about the defect.", "Provide age-appropriate stimulation."], 0,
    "Myelomeningocele is a congenital disorder that causes the spine and spinal canal to not close prior to birth, which results in the spinal cord, meninges, and nerve roots protruding out of the child's back in a fluid-filled sac. Before surgery, the infant must be handled carefully to reduce damage to the exposed spinal cord and to maintain the integrity of the sac.");
  mc("newborn", "A nurse is completing discharge instructions for a new mother and her 2-day-old newborn. The mother asks, \"How will I know if my baby gets enough breast milk?\" Which of the following responses should the nurse make?",
    ["\"Your baby should have a wake cycle of 30 to 60 minutes after each feeding.\"", "\"Your baby should wet 6 to 8 diapers per day.\"", "\"Your baby should burp after each feeding.\"", "\"Your baby should sleep at least 6 hours between feedings.\""], 1,
    "Newborns should wet 6 to 8 diapers per day. This is an indication that the newborn is getting enough fluids.");
  mc("newborn", "A nurse is caring for a client who is beginning to breastfeed her newborn after delivery. The new mother states, \"I don't want to take anything for pain because I am breastfeeding.\" Which of the following statements should the nurse make?",
    ["\"You need to take pain medications so you are more comfortable.\"", "\"We can time your pain medication so that you have an hour or two before the next feeding.\"", "\"All medications are found in breast milk to some extent.\"", "\"You have the option of not taking pain medication if you are concerned.\""], 1,
    "This answer provides the client an option that allows for administration of pain medication but minimizes the effect it will have on the newborn while breastfeeding.");
  mc("newborn", "A nurse is caring for a client who has rubella at the time of delivery and asks why her newborn is being placed in isolation. Which of the following responses by the nurse is appropriate?",
    ["\"The newborn might be actively shedding the virus.\"", "\"The newborn is at risk for developing a TORCH infection.\"", "\"The child might develop encephalitis, a complication of rubella.\"", "\"Exposure to rubella will suppress the newborn's immune response.\""], 0,
    "Infants born to mothers who have rubella will continue to shed the rubella virus for up to 18 months postdelivery.");
  mc("newborn", "A nurse in the nursery is caring for a newborn. The grandmother of the newborn asks if she can take the newborn to the mother's room. Which of the following is an appropriate response by the nurse?",
    ["\"You may carry your grandchild to the room.\"", "\"You can push the baby to the room in a wheeled bassinet.\"", "\"Have the mother call and I will take the baby to the room.\"", "\"If you show me your photo identification, you can take the infant.\""], 2,
    "Safety precautions include the use of identification bracelets placed on the parents and newborn, which nursery personnel must verify before permitting an infant to remain in the mother's room.");
  mc("newborn", "A nurse is assessing a newborn immediately following a scheduled cesarean delivery. Which of the following assessments is the nurse's priority?",
    ["Respiratory distress", "Hypothermia", "Accidental lacerations", "Acrocyanosis."], 0,
    "Shortly before labor, there is a decreased production of fetal lung fluid and a catecholamine surge that promotes fluid clearance from the lungs. Newborns born by cesarean, in which labor did not occur, can experience lung fluid retention, which leads to respiratory distress. The priority assessment when using the airway, breathing, circulation (ABC) approach to client care is to monitor the newborn for respiratory distress.");
  mc("newborn", "A nurse is assessing a newborn who was born at 42.5 weeks of gestation. Which of the following findings should the nurse expect?",
    ["Copious vernix", "Scant scalp hair", "Increased subcutaneous fat", "Dry, cracked skin"], 3,
    "A newborn who is postmature has dry, cracked skin.");
  mc("newborn", "A nurse is caring for a preterm newborn who is in an incubator to maintain a neutral thermal environment. The father of the newborn asks the nurse why this is necessary. Which of the following responses should the nurse make?",
    ["\"Preterm newborns have a smaller body surface area than normal newborns.\"", "\"The added brown fat layer in a preterm newborn reduces his ability to generate heat.\"", "\"Preterm newborns lack adequate temperature control mechanisms.\"", "\"The heat in the incubator rapidly dries the sweat of preterm newborns.\""], 2,
    "Preterm newborns have poor body control of temperature and need support to avoid losing heat. They require an external heat source, such as an incubator.");
  mc("newborn", "A nurse is completing a health history for a client who is at 6 weeks of gestation. The client informs the nurse that she smokes one pack of cigarettes per day. The nurse should advise the client that smoking places the client's newborn at risk for which of the following complications?",
    ["Hearing loss", "Intrauterine growth restriction", "Type 1 diabetes mellitus", "Congenital heart defects"], 1,
    "Clients who smoke place their newborns and themselves at risk for diverse complications, including fetal intrauterine growth restriction, placental abruption, placenta previa, preterm delivery, and fetal death.");
  mc("newborn", "A nurse in the emergency department is admitting a client who is at 40 weeks of gestation, has ruptured membranes, and the nurse observes the newborn's head is crowning. The client tells the nurse she wants to push. Which of the following statements should the nurse make? to",
    ["\"You should go ahead and push to assist the delivery.\"", "\"You should try to pant as the delivery proceeds.\"", "\"You should try to perform slow-paced breathing.\"", "\"You should take a deep, cleansing breath and breathe naturally.\""], 1,
    "Panting allows uterine forces to expel the fetus and permits controlled muscle expansion to avoid rapid expulsion of the fetal head.");
  mc("newborn", "A home health nurse is teaching a client who is breastfeeding about managing breast engorgement. Which of the following client statements indicates understanding of the teaching?",
    ["\"I'll let my baby drain one breast at each feeding.\"", "\"I'll try drinking an herbal tea to reduce the engorgement.\"", "\"I'll apply cold compresses 20 minutes before each feeding.\"", "\"I'll feed my baby every 2 hours.\""], 3,
    "Breast engorgement is relieved by emptying both breasts. The client might be able to accomplish this with more frequent feedings. Otherwise, she can pump her breasts after breastfeeding to ensure optimal emptying.");
  mc("newborn", "A nurse is assessing a newborn 1 hr after birth. Which of the following respiratory rates is within the expected reference range for a newborn?",
    ["22/min", "48/min", "100/min", "110/min"], 1,
    "The expected reference range for a newborn's resting respiratory rate is 30 to 60/min.");
  mc("newborn", "A nurse is planning care for a newborn who is small for gestational age (SGA). Which of the following is the priority intervention the nurse should include in the newborn's plan of care?",
    ["Monitor I&O.", "Monitor axillary temperature.", "Monitor blood glucose levels.", "Monitor weight."], 2,
    "Decreased stores of glycogen and a lower rate of gluconeogenesis place newborns who are SGA at higher risk for hypoglycemia. Monitoring of blood glucose levels is a priority intervention.");
  mc("newborn", "A nurse is assisting a client with breastfeeding. The nurse explains that which of the following reflexes will promote the newborn to latch?",
    ["Babinski", "Rooting", "Moro", "Stepping"], 1,
    "The rooting reflex is elicited when the client strokes the newborn's lips, cheek, or corner of the mouth with her nipple. The newborn will turn his head while making sucking motions with his mouth and latch onto the nipple.");
  mc("newborn", "A nurse is caring for a client who is breastfeeding her newborn and asks the nurse about the changes she should make in her diet. Which of the following dietary changes should the nurse suggest?",
    ["Increase her caloric intake by 600 kcal/day.", "Increase her fluid intake to 2.5 L/day.", "Reduce her intake of iron.", "Avoid shellfish."], 2,
    "Recommendations for some nutrients, such as iron and folic acid, are less during lactation than during pregnancy. Because maternal blood volume decreases after childbirth, the client's need for these nutrients also diminishes.");
  mc("newborn", "A nurse is teaching a newborn's parent to care for the umbilical cord stump. Which of the following instructions should the nurse include?",
    ["Wash the cord daily with mild soap and water.", "Cover the cord with the diaper.", "Apply petroleum jelly to the cord stump.", "Give a sponge bath until the cord stump falls off."], 3,
    "Immersing the umbilical cord stump in water can delay the process of drying, separation, and healing. Sponge baths are appropriate until the stump falls off.");
  mc("newborn", "A nurse is completing the admission assessment of a newborn. Which of the following anatomical landmarks should the nurse use when measuring the newborn's chest circumference?",
    ["Sternal notch", "Nipple line", "Xiphoid process", "Fifth intercostal space"], 1,
    "The nurse should measure the newborn's chest circumference at the nipple line.");
  mc("newborn", "A nurse in a prenatal clinic is caring for a client who believes that she might be pregnant because she feels the baby moving. Which of the following statements should the nurse make?",
    ["\"This is a presumptive sign of pregnancy.\"", "\"This is a probable sign of pregnancy.\"", "\"This is a possible sign of pregnancy.\"", "\"This is a positive sign of pregnancy.\""], 0,
    "Presumptive signs of pregnancy include physical changes that are apparent to the client, such as quickening.");
  mc("newborn", "A nurse on the labor and delivery unit is caring for a newborn immediately following birth. Which of the following actions by the nurse reduces evaporative heat loss by the newborn?",
    ["Placing the newborn on a warm surface", "Preventing air drafts", "Drying the newborn's skin thoroughly", "Maintaining ambient room temperature at 24¡ C (75¡ F)"], 2,
    "Heat loss through evaporation occurs when moisture on the skin is converted to a vapor. This process is the most significant cause of heat loss in the first few days of life but is minimized by quickly and thoroughly drying the infant");
  mc("newborn", "A nurse is caring for a newborn and assessing newborn reflexes. To elicit the Moro reflex, the nurse should take which of the following actions?",
    ["Perform a sharp hand clap near the infant.", "Hold the newborn vertically allowing one foot to touch the table surface.", "Place a finger at the base of the newborn's toes.", "Turn the newborn's head quickly to one side."], 0,
    "To elicit the Moro reflex, the nurse performs a sharp hand clap near the newborn and observes symmetric abduction and extension of the arms, fanning of the fingers with the thumb and forefinger to form a C, and then a return to a relaxed flexion position.");
  mc("newborn", "A nurse is caring for a newborn delivered by vaginal birth with a vacuum assist. The newborn's mother asks about the swollen area on her son's head. After palpation to identify that the swelling crosses the suture line, which of the following is an appropriate response by the nurse?",
    ["\"Mongolian spots can be found on the skin of many newborns.\"", "\"A caput succedaneum occurs due to compression of blood vessels.\"", "\"This is a cephalhematoma, which can occur spontaneously.\"", "\"This is erythema toxicum, which is a transient condition.\""], 1,
    "A caput succedaneum is an area of edema on the newborn's occiput, often seen where the cup of the vacuum was applied. It is present at birth and will disappear within 3 to 4 days.");
  mc("newborn", "A nurse places a newborn under a radiant heat warmer after birth. The purpose of this action is to prevent which of the following in the newborn?",
    ["Cold stress", "Shivering", "Basal metabolic rate reduction", "Brown fat production"], 0,
    "When an infant is stressed by cold exposure, oxygen consumption increases and pulmonary and peripheral vasoconstriction occurs. Metabolic demands for glucose increase. If the cold stress continues, hypoglycemia and metabolic acidosis can result.");
  mc("newborn", "A nurse in the newborn nursery is caring for a group of newborns. Which of the following newborns requires immediate intervention?",
    ["A newborn who is 24 hr post-delivery and has not voided", "A newborn who is 18 hr post-delivery and has acrocyanosis", "A newborn who is 24-hr post-delivery and has not passed meconium", "A newborn who is 12 hr post-delivery and has a temperature of 37.5¡ C (99.5¡ F)"], 3,
    "Hyperthermia in the newborn requires immediately intervention. Hyperthermia is typically caused by increased heat production related to sepsis or decreased heat loss.");
  mc("newborn", "A nurse is caring for a client who is breastfeeding and states that her nipples are sore. Which of the following interventions should the nurse suggest?",
    ["Apply mineral oil to the nipples between feedings.", "Keep the nipples covered between breastfeeding sessions.", "Increase the length of time between feedings.", "Change the newborn's position on the nipples with each feeding."], 3,
    "When the client's nipple is sore due to breastfeeding, the client should break the suction with her finger, remove the newborn from the breast, and try a different position. The newborn's mouth should be open wide before connecting with the nipple.");
  mc("newborn", "A nurse is assessing a newborn the day after delivery. The nurse notes a raised, bruised area on the left side of the scalp that does not cross the suture line. How should the nurse document this finding?",
    ["Caput succedaneum", "Cephalhematoma", "Molding", "Pilonidal dimple"], 1,
    "A cephalhematoma is a swelling, indicating bleeding under the subcutaneous tissues of the newborn's scalp. The collection of blood is beneath the periosteum of the cranial bone and therefore does not cross the suture line.");
  mc("newborn", "A nurse is teaching a client who is breastfeeding about dietary recommendations. Which of the following statements by the client indicates understanding of the teaching?",
    ["\"I will decrease my daily fiber intake.\"", "\"I'll make sure I reduce salt in my diet.\"", "\"I'll eat more protein at each meal.\"", "\"I will consume more vitamin D-rich foods.\""], 2,
    "During lactation, clients should consume about 25 g of additional protein per day, which is more than what is required by nonpregnant and nonlactating female clients.");
  mc("newborn", "A nurse is planning care for a preterm newborn. Which of the following nursing interventions to promote development should be included in the plan of care?",
    ["Position the newborn to promote extension of muscles.", "Use fingertips when calming the newborn.", "Cluster the newborn's care activities.", "Keep the newborn in a well-lit nursery."], 2,
    "By clustering activities and organizing care, the nurse prevents excessive interruptions and allows the newborn extended periods of rest and energy conservation that promote development.");
  mc("newborn", "A nurse is caring for a newborn and auscultates an apical heart rate of 130/min. Which of the following actions should the nurse take?",
    ["Ask another nurse to verify the heart rate.", "Document this as an expected finding.", "Call the provider to further assess the newborn.", "Prepare the newborn for transport to the NICU."], 1,
    "The expected reference range for an apical pulse in a newborn who is awake is 120 to 160/min. The nurse should document this as an expected finding.");
  mc("newborn", "A nurse is completing a newborn gestational age assessment. Which of the following findings should be recorded as part of this assessment on the newborn?",
    ["Acrocyanosis of hands and feet", "Anterior fontanel soft and level", "Plantar creases cover 2/3 of sole", "Vernix caseosa in inguinal creases"], 2,
    "Observing the presence of creases on the plantar surface is one of the components of a gestational age assessment.");
  mc("newborn", "A nurse is planning care for a newborn who has a new diagnosis of phenylketonuria (PKU). Which of the following actions should be included in the plan of care?",
    ["Initiate a controlled low-protein diet.", "Educate parents on blood glucose monitoring.", "Administer thyroid hormone replacement.", "Obtain a blood sample for blood type."], 0,
    "PKU is managed by eliminating phenylalanine from the diet. It is found in most natural food proteins, such as milk and infant formulas. A special low-protein, amino-acid formula that is low in phenylalanine is initiated and included in the plan of care.");
  mc("newborn", "A nurse in a clinic is teaching the mother of a 4-month-old infant who has been breastfed. The mother plans to switch her infant to an iron-fortified formula. Which of the following should be included in the teaching?",
    ["Iron facilitates development of vision in infants.", "Iron facilitates growth of bones in infants.", "Iron stores in infants begin to deplete.", "Iron is poorly absorbed in infants."], 2,
    "Iron stores in infants are adequate until about 6 months of age. Infants who are weaned before 6 months of age should be given iron-fortified formula until 12 months of age. Iron stores will also be supplemented with the addition of iron-fortified cereals and iron-rich foods to the infant's diet at 6 months of age.");
  mc("newborn", "A nurse is teaching about nutrition guidelines to a parent of a newborn. Which of the following statements by the parent indicates understanding of the teaching?",
    ["\"I should start solid foods when my baby is 3 months old.\"", "\"I should introduce cow's milk when my baby is 9 months old.\"", "\"I should wait to give fruit juice until my baby is 6 months of age.\"", "\"I should wait to begin fluoride supplements until my baby is 4 months of age.\""], 2,
    "Fruit juice provides minimal nutritional value to the infant's diet. Therefore, fruit juices should be limited and not offered until the infant is 6 months of age.");
  mc("newborn", "A nurse is completing an assessment of a 1-month-old newborn. Which of the following developmental skills is an expected finding?",
    ["Displays a social smile", "Follows movements of objects with eyes", "Reacts to sounds by turning head", "Makes babbling sounds"], 1,
    "A 1-month-old infant is able to follow movements with their eyes.");
  mc("newborn", "A nurse is teaching the parent of a newborn about bottle feeding. Which of the following statements by the parent indicates a need for further instruction?",
    ["\"I will keep my baby's head elevated while he is feeding.\"", "\"I will allow my baby to burp several times during each feeding.\"", "\"I will tip the nipple so air is present as my baby sucks.\"", "\"My baby will have soft, formed yellow stools.\""], 2,
    "The nipple should be held so it fills only with formula. The infant should not be permitted to suck air.");
  mc("newborn", "A nurse is planning care for a newborn who has spinal bifida. Which of the following actions should be included in the plan of care?",
    ["Obtain rectal temperatures.", "Place the newborn in the prone position.", "Cover the lesion with a dry dressing.", "Apply snug, clean diapers."], 1,
    "Placing the newborn in the prone position prevents trauma to the lesion. The newborn's knees should be assessed for evidence of skin breakdown.");
  mc("newborn", "A nurse is caring for a newborn who has macrosomia and whose mother has diabetes mellitus. The nurse should recognize which of the following newborn complications as the priority focus of care?",
    ["Hypoglycemia", "Hypomagnesemia", "Hyperbilirubinemia", "Hypocalcemia"], 0,
    "Newborns of mothers who have diabetes are at high risk for hypoglycemia due to the loss of high levels of glucose after the umbilical cord is cut. This results in fetal hyperinsulinemia. It can take several days for the newborn to adjust to secreting appropriate amounts of insulin for the lower level of blood glucose. Because severe hypoglycemia can lead to cyanosis and seizures, prevention of hypoglycemia becomes the nurse's priority focus of care.");
  mc("newborn", "A nurse is caring for a newborn whose mother is positive for the hepatitis B surface antigen. Which of the following should the infant receive?",
    ["Hepatitis B immune globulin at 1 week followed by hepatitis B vaccine monthly for 6 months", "Hepatitis B vaccine monthly until the newborn tests negative for the hepatitis B surface antigen", "Hepatitis B immune globulin and hepatitis B vaccine within 12 hr of birth", "Hepatitis B vaccine at 24 hr followed by hepatitis B immune globulin every 12 hr for 3 days"], 2,
    "A newborn whose mother is positive for the hepatitis B surface antigen should receive both the hepatitis B vaccine and the hepatitis B immune globulin within 12 hr of birth.");
  sata("newborn", "A nurse is assessing a newborn who has Trisomy 21 (Down's Syndrome). Which of the following are common characteristics? (Select all that apply.)",
    ["Transverse palmar creases", "Large ears", "Muscular hypertonicity", "Protruding tongue", "Low birth weight"], [0, 3],
    "Answer key taken from your question bank. Review this topic in your notes.");
  mc("newborn", "A nurse is assessing a newborn who has a coarctation of the aorta. Which of the following should the nurse recognize is a clinical manifestation of coarctation of the aorta?",
    ["Increased blood pressure in the arms with decreased blood pressure in the legs", "Decreased blood pressure in the arms with increased blood pressure in the legs", "Increased blood pressure in both the arms and the legs", "Decreased blood pressure in both the arms and the legs"], 0,
    "There is a narrowing next to the ductus arteriosus that results in an increased pressure proximal to the defect, with a decreased pressure distal to the obstruction. Therefore, an increased blood pressure in the arms with a decreased blood pressure in the legs would be a clinical manifestation of a coarctation of the aorta.");
  mc("newborn", "A nurse is assessing a newborn for manifestations of a large patent ductus arteriosus. Which of the following findings should the nurse expect?",
    ["Cyanosis with crying", "Systolic murmur", "Weak pulses", "Chronic hypoxemia"], 1,
    "A patent ductus arteriosus is failure of the artery connecting the aorta and pulmonary artery to close after birth, causing a left-to-right shunt. A systolic murmur is a clinical manifestation found in newborns who have a large patent ductus arteriosus.");
  mc("newborn", "A nurse is assessing a newborn. Which of the following should the nurse understand is a clinical manifestation of pyloric stenosis?",
    ["Absent bowel sounds", "Increased sodium levels", "Projectile vomiting after feedings", "Golf ball-sized mass over the left quadrant"], 2,
    "Pyloric stenosis is a narrowing and thickening of the pyloric canal between the stomach and the duodenum, resulting in projectile vomiting.");
  mc("newborn", "A nurse is observing the electronic fetal heart rate monitor tracing for a client who is at 40 weeks of gestation and is in labor. The nurse should suspect a problem with the umbilical cord when she observes which of the following patterns?",
    ["Early decelerations", "Accelerations", "Late decelerations", "Variable decelerations"], 3,
    "Variable decelerations occur when the umbilical cord becomes compressed and disrupts the flow of oxygen to the fetus.");
  mc("newborn", "A nurse is assessing a newborn who has developmental dysplasia of the hip (DDH). Which of the following findings should the nurse expect?",
    ["Absent plantar reflexes", "Lengthened thigh on the affected side", "Inwardly turned foot on the affected side", "Asymmetric thigh folds"], 3,
    "Gluteal and thigh skin folds that are not equal and symmetric is a sign of DDH.");
  mc("newborn", "A nurse is caring for a client who has just delivered her first newborn. The nurse anticipates hyperbilirubinemia due to Rh incompatibility. The nurse should understand that hyperbilirubinemia occurs with Rh incompatibility for which of the following reasons?",
    ["The client's blood does not contain the Rh factor, so she produces anti-Rh antibodies that cross the placental barrier and cause hemolysis of red blood cells in newborns.", "The client's blood contains the Rh factor and the newborn's does not, and antibodies that destroy red blood cells are formed in the fetus.", "The client has a history of receiving a transfusion with Rh-negative blood.", "The client's anti-A and anti-B antibodies cross the placenta and cause the destruction of the fetal red blood cells."], 0,
    "If the Rh-negative client has been exposed to Rh-positive fetal blood, she will produce antibodies against Rh factor. These antibodies can cross the placenta and destroy the red blood cells of the Rh-positive fetus. This accelerated rate of red blood cell destruction results in the increased release of bilirubin. The newborn's serum bilirubin level can rise quickly.");
  mc("newborn", "A nurse is caring for a client who has just delivered a newborn. The nurse notes secretions bubbling out of the newborn's nose and mouth. Which of the following actions is the nurse's priority?",
    ["Suction the nose with a bulb syringe.", "Suction the mouth with a bulb syringe.", "Use a suction catheter with low negative pressure.", "Turn the newborn on his side."], 1,
    "The greatest risk to the newborn is aspiration of secretions. Removing the secretions from the mouth first is the priority action.");
  mc("newborn", "A nurse is caring for a newborn who has hydrocephalus. Which of the following manifestations should the nurse expect to find?",
    ["Over-riding suture lines", "Dilated scalp veins", "Hypertension", "A backward sloping appearance of the forehead."], 1,
    "Manifestations of hydrocephalus in newborns include dilated scalp veins, separated sutures, and, in late infancy, frontal enlargement.");
  mc("newborn", "A nurse is caring for a preterm newborn who has a nasogastric tube and who recently began intermittent gavage feedings of formula. The nurse notes increased abdominal distention, lethargy, bloody stools, and increasing gastric residuals before feedings. The nurse should suspect which of the following?",
    ["Overstimulation", "Necrotizing enterocolitis", "Need for placement of a gastrostomy tube", "Intraventricular hemorrhage"], 1,
    "Premature newborns who are formula fed are much more likely to contract this acute inflammatory disease of the gastrointestinal mucosa.");
  mc("newborn", "A nurse is preparing to administer oxygen via hood therapy to a newborn who was born at 30 weeks of gestation. Which of the following is an appropriate nursing action when providing care to this infant?",
    ["Remove the hood every hour for 10 min to facilitate bonding.", "Insert an orogastric tube for decompression of the stomach.", "Place the newborn in Trendelenburg position.", "Maintain oxygen saturations between 93% to 95%."], 3,
    "Rates of retinopathy of prematurity and bronchopulmonary dysplasia in preterm newborns are reduced if oxygen saturations are maintained between 93% and 95%.");
  mc("newborn", "A nurse is caring for a term macrosomic newborn whose mother has poorly controlled type 2 diabetes. The newborn has respiratory distress syndrome. The nurse should be aware that the most likely cause of the respiratory distress is which of the following?",
    ["Hyperinsulinemia", "Increased deposits of fat in the chest and shoulder area", "Brachial plexus injury", "Increased blood viscosity"], 0,
    "High levels of maternal glucose increase the production of fetal insulin. High fetal insulin levels interfere with the production of surfactant.");
  mc("newborn", "A nurse is providing teaching to the mother of a newborn born small for gestational age. Which of the following should the nurse include as a possible cause of this condition?",
    ["Placental insufficiency", "Preterm delivery", "Fetal hyperinsulinemia", "Perinatal asphyxia"], 0,
    "Placental insufficiency is a cause of small for gestational age. It can result from maternal infections, embryonic placental deficiency, teratogens, or chromosomal abnormalities.");
  mc("newborn", "A nurse is caring for a newborn who is small for gestational age (SGA). Which of the following findings is associated with this condition?",
    ["Moist skin", "Protruded abdomen", "Gray umbilical cord", "Wide skull sutures"], 3,
    "Newborns who are SGA have wide skull sutures due to inadequate bone growth. Head circumference is smaller than in a normal newborn and there is reduced brain capacity.");
  mc("newborn", "A nurse is admitting a term newborn following a cesarean birth. The nurse observes that the newborn's skin is slightly yellow. This finding indicates the newborn is experiencing a complication related to which of the following?",
    ["Maternal/newborn blood group incompatibility", "Absence of vitamin K", "Physiologic jaundice", "Maternal cocaine abuse"], 0,
    "Maternal/newborn blood group incompatibility is the most common form of pathologic jaundice and the jaundice appears within the first 24 hr of life.");
  mc("newborn", "A nurse is teaching the parent of a newborn about car seat use. Which of the following information should the nurse include?",
    ["\"Position the newborn at a 45-degree angle in the car seat.\"", "\"Place the retainer clip across the newborn's abdomen.\"", "\"Keep the car seat rear-facing until the newborn can sit unsupported.\"", "\"Place the shoulder harness straps below the level of the newborn's armpits.\""], 0,
    "The nurse should instruct the parent to place the newborn at a 45¡ angle to prevent the newborn's head from falling forward and obstructing the airway.");
  mc("newborn", "A nurse is teaching about crib safety with the parent of a newborn. Which of the following statements by the client indicates understanding of the teaching?",
    ["\"I will place my baby on his stomach when he is sleeping.\"", "\"I should remove extra blankets from my baby's crib.\"", "\"I should pad the mattress in my baby's crib so that he will be more comfortable when he sleeps.\"", "\"I should place my baby's crib next to the heater to keep him warm during the winter.\""], 1,
    "Loose bedding such as sheets and blankets could cover the baby's head and lead to suffocation.");
  mc("newborn", "A nurse is observing a new mother bathing her newborn son for the first time. For which of the following actions should the nurse intervene?",
    ["The mother cleans the newborn's eyes from the inner canthus outwards.", "The mother cleans the umbilical cord with tap water.", "The mother leaves the yellow exudate on the circumcision site.", "The mother plans to use a cotton-tipped swab to clean the nares."], 3,
    "To prevent injury, the mother should use the corner of a washcloth to clean the newborns ears and nares.");
  mc("newborn", "A nurse is caring for a newborn 4 hr after birth. Which of the following actions should the nurse include in the plan of care to prevent jaundice?",
    ["Begin phototherapy.", "Initiate early feeding.", "Suction excess mucus with a bulb syringe.", "Prepare for an exchange blood transfusion."], 1,
    "Prevention of jaundice can be facilitated best by early and frequent feeding, which stimulates intestinal activity and passage of meconium. Jaundice occurs due to elevated serum bilirubin, which is excreted primarily in the newborn's stool. Physiologic jaundice manifests after 24 hr and is considered benign. However, bilirubin may accumulate to hazardous levels and lead to a pathologic condition.");
  mc("newborn", "A nurse is reviewing a newborn's laboratory results. Which of the following findings is the nurse's priority?",
    ["Platelets 200,000/mm3", "Bilirubin 19 mg/dL", "Blood glucose 45 mg/dL", "Hemoglobin 22 g/dL"], 1,
    "Bilirubin 19 mg/dL is above the expected reference range for a newborn at 4 hr of age. A bilirubin level greater than 15 mg/dL or an increase by more than 6 mg/dL in 24 hr is pathologic or nonphysiologic jaundice. Pathologic jaundice is a result of an underlying disease and occurs before 24 hr of age; therefore, this is the nurse's priority finding.");
  mc("newborn", "A nurse is caring for a client who is in preterm labor with a current L/S ratio of 1:1. Which of the following actions should the nurse take?",
    ["Infuse a bolus of IV fluid.", "Administer hydralazine 25 mg IV.", "Prepare the client for immediate delivery.", "Administer betamethasone 12 mg IM."], 3,
    "Betamethasone is classified as a corticosteroid medication. Corticosteroids are often administered to the mother to assist in fetal lung maturity. These are usually administered by IM injection of 12 mg for the first two doses. The subsequent dosing should be 6 mg by IM every 12 hr x 4 doses.");
  mc("newborn", "A nurse is providing teaching about phenylketonuria (PKU) testing to the parent of a newborn. Which of the following statements by the parent indicates a need for additional teaching?",
    ["\"My baby will be placed under special lights if the test result is positive.\"", "\"My baby needs to be on formula or breast milk before the test can be done.\"", "\"This test checks for a genetic disorder that can be managed by diet.\"", "\"Sometimes the test is repeated in the doctor's office at the baby's 2-week check-up.\""], 0,
    "Phototherapy is used to reduce circulating unconjugated bilirubin in infants who have hyperbilirubinemia. Phototherapy for hyperbilirubinemia uses light energy to lower the bilirubin level in the newborn's blood. This would not be appropriate therapy for PKU.");
  mc("newborn", "A nurse is assessing a newborn following a vacuum-assisted delivery. Which of the following findings should the nurse report to the provider?",
    ["Poor sucking", "Blue coloring of the hands and feet", "Soft, edematous area on the scalp", "Facial edema"], 0,
    "Vacuum-assisted birth involves attaching a vacuum cup to the fetal head and using negative pressure to assist in the birth of the head, placing the newborn at risk for a subdural hematoma. The nurse should report manifestations of cerebral irritation, such as listlessness and poor sucking to the provider.");
  mc("newborn", "A nurse is caring for an infant who is receiving phototherapy. Which of the following findings requires intervention by the nurse?",
    ["A pink rash appears on the newborn's trunk.", "The newborn's eyes are covered with a mask.", "The mother applies lotion to the newborn's skin.", "The newborn's stools increase in number."], 2,
    "Lotions and ointments should not be applied as they can absorb heat and cause burns.");
  mc("newborn", "The nurse recognizes that a common acute symptom which would alert the nurse to the fact that a preterm infant is developing respiratory distress syndrome (RDS) is:",
    ["Hyperglycemia", "Intercostal vertebral retractions", "Inspiratory wheezing", "Tremors"], 1,
    "Answer key taken from your question bank. Review this topic in your notes.");
  mc("newborn", "A newborn is reported to have breastfed very well during the first hour after birth. The baby is now 8 hours old and has not had a second successful feeding. The nurse would",
    ["Advice the mother to the discuss this with the newborn’s pediatrician", "Review newborn sleep cycles and hunger cues", "Teach the mother to pump her breast", "Advice the mother to stop nursing and offer formula"], 1,
    "Answer key taken from your question bank. Review this topic in your notes.");
  mc("newborn", "A nurse is caring for a large for gestational age (LGA) newborn whose blood glucose level is 20 mg/dl. Which of the following interventions has priority in the nurse plans of care for this newborn?",
    ["Assess for hypothermia", "Evaluate glucose level again in 4 hours", "Provide glucose water exclusively", "Initiate IV 10% dextrose in water in the neonatal unit"], 3,
    "Answer key taken from your question bank. Review this topic in your notes.");
  mc("newborn", "The nurse is aware that a newborn must be kept away from air conditioning to prevent which type of heat loss?",
    ["Conduction", "Evaporation", "Convection", "Radiation"], 2,
    "Answer key taken from your question bank. Review this topic in your notes.");
  sata("newborn", "When reviewing the delivery history of a newborn, the nurse noticed that the mother tested positive for cocaine at several prenatal visits. The nurse should monitor this newborn for which of the following behaviors? Select all that apply",
    ["Decreased Moro reflex", "Irritability and inability to calm", "Frequent periods of apnea", "Hypoactivity", "Weak cry"], [1, 2],
    "Answer key taken from your question bank. Review this topic in your notes.");
  mc("newborn", "A nurse who is caring for a newborn observes signs of jitteriness and lethargy. Which is the following is the appropriate nursing action?",

    "Answer key taken from your question bank. Review this topic in your notes.");
  mc("newborn", "A nurse is giving discharge teaching to a client and whose newborn had a circumcision with the plastibell technique. Which of the following statement by the client indicates she understanding the teaching on her newborn’s circumcision care?",
    ["I ‘ll expects the plastic ring to fall off by itself within a week", "I’ll wash his penis with warm water and mild soap each day", "A moderate amount of bleeding after the procedure is normal", "I’ll apply lots of Vaseline throughout the day"], 0,

  sata("newborn", "A nurse assesses the gestational age of a newborn to the 27 weeks. Which of the following are commonly found in a premature infant? Select all the apply",
    ["Abundant vernix", "Loud and lusty cry", "Positive sucking reflex", "Unstable temperature control", "Positive head lag"], [0, 2, 3],
    "Answer key taken from your question bank. Review this topic in your notes.");
  mc("newborn", "The nurse evaluates that the newborn’s Moro reflex is within normal limits. Which response by the newborn prompted the nurse’s confusion?",
    ["Raises arms in a C formation in response to a loud noise", "Holds onto object when placed in hand", "Turns head toward the right side when the right cheek is touched", "Attempts to walk when the sole of the foot touches a hard surface."], 0,
    "Answer key taken from your question bank. Review this topic in your notes.");
  mc("newborn", "The nurse reviews the labor and delivery record of the 2 hour old 10 pound male newborn and sees this notation: 40…… missing .. important for the nurse to plan to assess the newborn carefully for which condition?",
    ["Acrocyanosis", "Undescended testicles", "Fractured clavicles", "Mongolian spot"], 2,
    "Answer key taken from your question bank. Review this topic in your notes.");
  mc("newborn", "A woman just delivered a full-term infant in the car on the way to the hospital. The temperature outside is 10 degrees F. in response to the cold environment the nurse knows that the infant’s body will immediately begin to produce heat by which mechanism.",
